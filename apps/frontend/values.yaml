# See apps/backend/values.yaml and charts/common/values.yaml for why
# this file is fully self-contained.

nameOverride: ""
fullnameOverride: ""
environment: dev

image:
  repository: acrhomeeasedev.azurecr.io/homeease/frontend
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  labels: {}
  annotations: {}

workloadIdentity:
  enabled: false
  clientId: ""

podLabels: {}
podAnnotations: {}

# nginxinc/nginx-unprivileged's built-in `nginx` user is uid/gid 101,
# not the 1001 the three Node services use — checked directly against
# the image (`docker run ... id nginx`), not assumed. Getting this
# wrong means the container never starts: CrashLoopBackOff on a
# permission error that doesn't obviously point at securityContext.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Static content baked into the image at build time — nothing to warm
# up, no startup probe needed.
startupProbe: {}

env: []
envFrom: []
volumes: []
volumeMounts: []
extraVolumes: []
extraVolumeMounts: []

# No /tmp override needed either: this image's nginx.conf already
# redirects every temp path (proxy/client_body/fastcgi/uwsgi/scgi) to
# /tmp, and access/error logs are symlinked to stdout/stderr —
# verified against the actual image. common.deployment's automatic
# /tmp emptyDir (added whenever readOnlyRootFilesystem is true) is
# sufficient on its own.

secretProviderClass:
  enabled: false
  keyvaultName: ""
  tenantId: ""
  objects: []
  secretObjects: []

networkPolicy:
  enabled: false
  policyTypes: []
  ingress: []
  egress: []

priorityClassName: ""
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
