apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: azure
    includeSelectors: false

images:
  - name: homeease/frontend
    newName: acrhomeeasedev.azurecr.io/homeease/frontend
    newTag: 5d4e71d3fcd2

patches:
  - target:
      kind: Ingress
      name: frontend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.4-224-88-104.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.4-224-88-104.nip.io
