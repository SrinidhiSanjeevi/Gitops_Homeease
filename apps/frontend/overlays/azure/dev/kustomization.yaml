apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: azure
    includeSelectors: false

images:
  - name: homeease/frontend
    newName: acrhomeeasedev.azurecr.io/homeease/frontend
    newTag: 5d4e71d3fcd2

patches:
  - target:
      kind: Ingress
      name: frontend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.4-224-88-104.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.4-224-88-104.nip.io
      # Presentation URL: http://4.224.88.104 with no Host header match
      # (bare IP) falls through to this second, host-less rule — the
      # existing api./admin. host-specific rules on the OTHER two
      # Ingress objects are untouched, so backend/admin-backend keep
      # working exactly as before. ssl-redirect is disabled so the bare
      # IP serves plain HTTP directly instead of 308-redirecting to
      # https://4.224.88.104, which has no valid certificate for an IP
      # address and would just reproduce the same warning nip.io gave.
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
      - op: add
        path: /spec/rules/-
        value:
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: frontend
                    port:
                      name: http
