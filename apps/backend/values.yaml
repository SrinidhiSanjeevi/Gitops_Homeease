# Base values — environment-agnostic. See charts/common/values.yaml
# for why this file is fully self-contained rather than relying on
# the library chart's own values.yaml (it's never loaded).
# image.tag is deliberately absent: set per environment
# (values-dev.yaml etc.) and, once the promotion flow exists (Task
# 10), by the value the promotion PR bumps — never hand-edited here.

nameOverride: ""
fullnameOverride: ""
environment: dev

image:
  repository: acrhomeeasedev.azurecr.io/homeease/backend
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  labels: {}
  annotations: {}

workloadIdentity:
  enabled: false
  clientId: ""

podLabels: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Mongo connection warm-up can outlast the readiness probe's initial
# delay on a cold start. This gives a new pod up to 2 minutes before
# liveness/readiness even start counting, instead of being killed for
# being slow rather than unhealthy.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 24

env: []
envFrom: []
volumes: []
volumeMounts: []
extraVolumes: []
extraVolumeMounts: []

secretProviderClass:
  enabled: false
  keyvaultName: ""
  tenantId: ""
  objects: []
  secretObjects: []

networkPolicy:
  enabled: false
  policyTypes: []
  ingress: []
  egress: []

priorityClassName: ""
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
