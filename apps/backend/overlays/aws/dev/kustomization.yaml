apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: aws
    includeSelectors: false

images:
  # EKS pulls from Elastic Container Registry. Tag is bumped by the same
  # CI workflow as the Azure side — same image, pushed to both registries.
  - name: homeease/backend
    newName: REPLACE-WITH-ACCOUNT-ID.dkr.ecr.REPLACE-WITH-REGION.amazonaws.com/homeease/backend
    newTag: REPLACE-WITH-GIT-SHA

patches:
  - target:
      kind: Ingress
      name: backend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.dev.aws.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.dev.aws.example.com
