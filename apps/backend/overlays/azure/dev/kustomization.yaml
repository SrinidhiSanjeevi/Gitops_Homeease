apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base
  - secretproviderclass.yaml

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: azure
    includeSelectors: false

images:
  # AKS pulls from Azure Container Registry. Tag is bumped by CI on every
  # merge to main (see app_Homeease's GitHub Actions workflow) — never
  # hand-edited except to seed it the first time.
  - name: homeease/backend
    newName: acrhomeeasedev.azurecr.io/homeease/backend
    newTag: 5d4e71d3fcd2

patches:
  - target:
      kind: Ingress
      name: backend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.4-224-88-104.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.4-224-88-104.nip.io
  # Azure AD Workload Identity: the client-id annotation tells the identity
  # federation which Azure AD app this ServiceAccount maps to.
  - target:
      kind: ServiceAccount
      name: backend
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: backend
        labels:
          azure.workload.identity/use: "true"
        annotations:
          azure.workload.identity/client-id: "89286efc-8fa8-4e09-9664-a3b86fdeff89"
  # Required on the POD itself, not just the ServiceAccount — the workload
  # identity mutating webhook checks this label here before it will inject
  # the federated-token projected volume.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
