apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: azure
    includeSelectors: false

images:
  # AKS pulls from Azure Container Registry. Tag is bumped by CI on every
  # merge to main (see app_Homeease's GitHub Actions workflow) — never
  # hand-edited except to seed it the first time.
  - name: homeease/backend
    newName: acrhomeeasedev.azurecr.io/homeease/backend
    newTag: REPLACE-WITH-GIT-SHA

patches:
  - target:
      kind: Ingress
      name: backend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.dev.azure.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.dev.azure.example.com
