# Azure Key Vault provider for the Secrets Store CSI driver. The driver +
# azure provider ship as the AKS-managed key_vault_secrets_provider addon
# (already enabled in terraform/azure/modules/aks) — nothing extra needs
# installing on the cluster for this to work.
#
# Requires the workload identity annotation on the backend ServiceAccount
# (set below, in this overlay's kustomization.yaml patches) so the driver
# can authenticate to Key Vault as this service's own identity.
#
# backend and admin-backend share one Azure AD workload identity
# (id-homeease-app-dev / terraform module workload_identity_app), which
# has its own federated credential per ServiceAccount — see
# terraform/azure/environments/dev/main.tf, additional_service_accounts.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend
spec:
  provider: azure
  parameters:
    clientID: "89286efc-8fa8-4e09-9664-a3b86fdeff89" # terraform output workload_identity_app_client_id
    keyvaultName: "kv-homeease-dev-hs01" # terraform output key_vault_name
    tenantId: "71aa34ea-4bb1-42f9-8f28-80e46897411d" # az account show --query tenantId
    objects: |
      array:
        - |
          objectName: mongo-uri
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: email-user
          objectType: secret
        - |
          objectName: email-pass
          objectType: secret
        - |
          objectName: email-from
          objectType: secret
  # Also syncs into a native k8s Secret, so backend's required env vars
  # (MONGO_URI, JWT_SECRET) plus the email-sending feature's vars can be
  # wired via envFrom (see base/deployment.yaml) without the app knowing
  # about the CSI mount.
  secretObjects:
    - secretName: backend-secrets
      type: Opaque
      data:
        - objectName: mongo-uri
          key: MONGO_URI
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: email-user
          key: EMAIL_USER
        - objectName: email-pass
          key: EMAIL_PASS
        - objectName: email-from
          key: EMAIL_FROM
