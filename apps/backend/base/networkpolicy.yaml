# Default-deny ingress, explicit allow only. This object is only ENFORCED
# if the cluster's CNI actually implements NetworkPolicy — on both clouds
# that's an opt-in, not automatic:
#   - AKS:  Azure CNI Overlay + Azure NPM (or Calico) network policy,
#           turned on at cluster creation. CNI Overlay alone only handles
#           pod IP addressing, it does NOT enforce policy by itself.
#   - EKS:  Amazon VPC CNI >= v1.14 with ENABLE_NETWORK_POLICY=true, or the
#           Calico/Cilium add-on. The default VPC CNI install ignores
#           NetworkPolicy objects entirely.
# If `kubectl describe networkpolicy` shows this object but traffic isn't
# actually blocked, that's the first thing to check, not this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeease
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    # Public API traffic — arrives from the ingress-nginx controller pod,
    # which lives in its own namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
    # Other HomeEase services in this same namespace calling backend
    # server-to-server (frontend, admin-backend).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
  # No egress block: egress stays unrestricted (backend needs to reach
  # MongoDB, payment-service, and outbound notification providers).
