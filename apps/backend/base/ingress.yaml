apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeease
  annotations:
    # No-op until platform/cert-manager is actually installed (still a
    # placeholder per platform/README.md) — harmless to set now, picked up
    # automatically once cert-manager + this ClusterIssuer exist.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dev.example.com # overwritten per cloud/environment, see overlays/*/kustomization.yaml
      secretName: backend-tls
  rules:
    - host: api.dev.example.com # overwritten per cloud/environment, see overlays/*/kustomization.yaml
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
