apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeease
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    # Matches the container's port (5000), not 80 — frontend's nginx.conf
    # upstream block hardcodes `server backend:5000;`, and Ingress
    # references this port by name ("http"), not by number, so this is
    # safe to set to whatever the app actually listens on.
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
