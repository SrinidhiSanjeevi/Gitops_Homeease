apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeease
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread pods across nodes so a single node loss doesn't take out
      # every replica at once. "ScheduleAnyway" means the scheduler tries
      # its best but still schedules the pod if it can't spread it evenly
      # (a 1-node dev cluster shouldn't ever become unschedulable).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          # name:tag here is a placeholder — the real registry + tag are
          # set per cloud/environment by the `images:` block in
          # overlays/<cloud>/<env>/kustomization.yaml.
          image: homeease/backend:placeholder
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Mongo connection warm-up can outlast the readiness probe's
          # initial delay on a cold start — this gives a new pod up to
          # 2 minutes before liveness/readiness even start counting.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Populated by the Secrets Store CSI driver's secretObjects sync
          # (see overlays/<cloud>/dev/secretproviderclass.yaml) — the app
          # reads MONGO_URI / JWT_SECRET / EMAIL_* from process.env exactly
          # as it already does locally via .env; it never needs to know
          # these came from a CSI mount, or which cloud's secret store they
          # came from.
          # paymentClient.js falls back to http://127.0.0.1:5002 (a local-
          # dev-only default) when this isn't set — without it, backend
          # calls itself instead of payment-service, and every payment
          # call fails.
          env:
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:5002
          envFrom:
            - secretRef:
                name: backend-secrets
          volumeMounts:
            # readOnlyRootFilesystem is on above, but Node/npm write
            # scratch files to /tmp unconditionally — this avoids every
            # pod crashing on its first write to a read-only /tmp.
            - name: tmp
              mountPath: /tmp
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            # Must match metadata.name of the SecretProviderClass created
            # per cloud in overlays/<cloud>/dev/secretproviderclass.yaml.
            volumeAttributes:
              secretProviderClass: backend
