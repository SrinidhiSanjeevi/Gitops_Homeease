environment: dev

image:
  tag: "REPLACE-WITH-GIT-SHA"   # e.g. a2aa6c4 — bumped by CI/promotion, never by hand once that flow exists (Task 10)

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false   # single replica in dev — see common/values.yaml for why this stays off until replicaCount >= 2
