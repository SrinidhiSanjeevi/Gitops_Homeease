apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No ingress.yaml here on purpose — payment-service is never reached from
# outside the cluster, only from backend (see networkpolicy.yaml).
resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - hpa.yaml
  - pdb.yaml
