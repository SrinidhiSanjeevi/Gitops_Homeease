apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: homeease
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    # Matches the container's port (5002), consistent with the same fix
    # already applied to backend/admin-backend's Services.
    - name: http
      port: 5002
      targetPort: http
      protocol: TCP
