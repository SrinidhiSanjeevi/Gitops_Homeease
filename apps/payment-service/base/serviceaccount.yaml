# Its own ServiceAccount, not a shared one — Azure Workload Identity and
# AWS IRSA both federate on (namespace, service-account-name), so a shared
# SA across services would mean every service inherits whatever secret
# access this one carries. Cloud-specific identity annotations are added
# per cloud in overlays/<cloud>/dev/kustomization.yaml, not here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: homeease
