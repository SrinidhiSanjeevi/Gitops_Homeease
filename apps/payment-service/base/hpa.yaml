# No CPU/memory-based scaling for payment traffic — a CPU target doesn't
# reflect actual payment load. Kept as a fixed floor/ceiling (1-2) rather
# than a real autoscaling policy; revisit with a request-queue-depth
# metric if payment volume grows enough to need it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: homeease
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
