# AWS Secrets Manager provider for the Secrets Store CSI driver (the
# driver + ASCP ship as the EKS add-on "AWS Secrets Manager and Config
# Provider" — enable it once on the cluster, nothing per-app to install).
#
# Requires the IRSA role-arn annotation on the payment-service
# ServiceAccount (set below, in this overlay's kustomization.yaml patches)
# so the driver can authenticate to Secrets Manager as this service's own
# IAM role, not a shared one.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-service
spec:
  provider: aws
  parameters:
    region: REPLACE-WITH-AWS-REGION # e.g. ap-south-1
    objects: |
      - objectName: "homeease/dev/payment-service/razorpay-key-id"
        objectType: "secretsmanager"
      - objectName: "homeease/dev/payment-service/razorpay-key-secret"
        objectType: "secretsmanager"
      - objectName: "homeease/dev/payment-service/razorpay-webhook-secret"
        objectType: "secretsmanager"
  # Also syncs into a native k8s Secret, so the three RAZORPAY_* env vars
  # payment-service/config/validateEnv.js requires can be wired via envFrom
  # (see base/deployment.yaml) without the app knowing about the CSI mount.
  secretObjects:
    - secretName: payment-service-razorpay
      type: Opaque
      data:
        - objectName: "homeease/dev/payment-service/razorpay-key-id"
          key: RAZORPAY_KEY_ID
        - objectName: "homeease/dev/payment-service/razorpay-key-secret"
          key: RAZORPAY_KEY_SECRET
        - objectName: "homeease/dev/payment-service/razorpay-webhook-secret"
          key: RAZORPAY_WEBHOOK_SECRET
