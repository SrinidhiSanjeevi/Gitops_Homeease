# Azure Key Vault provider for the Secrets Store CSI driver. The driver +
# azure provider ship as the AKS-managed key_vault_secrets_provider addon
# (already enabled in terraform/azure/modules/aks) — nothing extra needs
# installing on the cluster for this to work.
#
# Requires the workload identity annotation on the payment-service
# ServiceAccount (set below, in this overlay's kustomization.yaml patches)
# so the driver can authenticate to Key Vault as this service's own
# identity, not a shared one.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-service
spec:
  provider: azure
  parameters:
    clientID: "8c163fcc-20af-4071-a7c1-6758d7902866" # terraform output workload_identity_payment_client_id (id-homeease-payment-dev)
    keyvaultName: "kv-homeease-dev-hs01" # terraform output key_vault_name
    tenantId: "71aa34ea-4bb1-42f9-8f28-80e46897411d" # az account show --query tenantId
    objects: |
      array:
        - |
          objectName: razorpay-key-id
          objectType: secret
        - |
          objectName: razorpay-key-secret
          objectType: secret
        - |
          objectName: razorpay-webhook-secret
          objectType: secret
        - |
          objectName: mongo-uri
          objectType: secret
  # Also syncs into a native k8s Secret, so all four env vars
  # payment-service/config/validateEnv.js requires (MONGO_URI plus the
  # three RAZORPAY_* vars) can be wired via envFrom (see base/deployment.yaml)
  # without the app knowing about the CSI mount. Kept in one Secret object
  # (name unchanged) rather than a second envFrom entry, since that would
  # also require an equivalent change to the AWS overlay, which is out of
  # scope here.
  secretObjects:
    - secretName: payment-service-razorpay
      type: Opaque
      data:
        - objectName: razorpay-key-id
          key: RAZORPAY_KEY_ID
        - objectName: razorpay-key-secret
          key: RAZORPAY_KEY_SECRET
        - objectName: razorpay-webhook-secret
          key: RAZORPAY_WEBHOOK_SECRET
        - objectName: mongo-uri
          key: MONGO_URI
