# Azure Key Vault provider for the Secrets Store CSI driver. The driver +
# azure provider ship as the AKS-managed key_vault_secrets_provider addon
# (already enabled in terraform/azure/modules/aks) — nothing extra needs
# installing on the cluster for this to work.
#
# Requires the workload identity annotation on the payment-service
# ServiceAccount (set below, in this overlay's kustomization.yaml patches)
# so the driver can authenticate to Key Vault as this service's own
# identity, not a shared one.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-service
spec:
  provider: azure
  parameters:
    clientID: "8c163fcc-20af-4071-a7c1-6758d7902866" # terraform output workload_identity_payment_client_id (id-homeease-payment-dev)
    keyvaultName: "kv-homeease-dev-hs01" # terraform output key_vault_name
    tenantId: "71aa34ea-4bb1-42f9-8f28-80e46897411d" # az account show --query tenantId
    # razorpay-webhook-secret deliberately NOT requested here. The
    # Secrets Store CSI driver fails the ENTIRE mount if any one object
    # in this list doesn't exist in Key Vault — since Razorpay webhooks
    # aren't being configured yet (see config/validateEnv.js and
    # controllers/paymentController.js in app_Homeease/payment-service),
    # requesting a secret that doesn't exist would block the whole
    # deployment over an optional feature. Add it back here (and to
    # secretObjects below) once a real webhook secret exists in Key
    # Vault and RAZORPAY_WEBHOOK_SECRET should be wired up.
    objects: |
      array:
        - |
          objectName: razorpay-key-id
          objectType: secret
        - |
          objectName: razorpay-key-secret
          objectType: secret
        - |
          objectName: mongo-uri
          objectType: secret
  # Also syncs into a native k8s Secret, so the env vars
  # payment-service/config/validateEnv.js actually requires (MONGO_URI,
  # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET) can be wired via envFrom (see
  # base/deployment.yaml) without the app knowing about the CSI mount.
  secretObjects:
    - secretName: payment-service-razorpay
      type: Opaque
      data:
        - objectName: razorpay-key-id
          key: RAZORPAY_KEY_ID
        - objectName: razorpay-key-secret
          key: RAZORPAY_KEY_SECRET
        - objectName: mongo-uri
          key: MONGO_URI
