# Azure Key Vault provider for the Secrets Store CSI driver. The driver +
# azure provider ship as the AKS-managed key_vault_secrets_provider addon
# (already enabled in terraform/azure/modules/aks) — nothing extra needs
# installing on the cluster for this to work.
#
# Requires the workload identity annotation on the payment-service
# ServiceAccount (set below, in this overlay's kustomization.yaml patches)
# so the driver can authenticate to Key Vault as this service's own
# identity, not a shared one.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-service
spec:
  provider: azure
  parameters:
    clientID: "REPLACE-WITH-WORKLOAD-IDENTITY-CLIENT-ID" # terraform output workload_identity_client_id
    keyvaultName: "REPLACE-WITH-KEYVAULT-NAME" # e.g. kv-homeease-dev-hs01 — terraform output key_vault_name
    tenantId: "REPLACE-WITH-AZURE-TENANT-ID"
    objects: |
      array:
        - |
          objectName: razorpay-key-id
          objectType: secret
        - |
          objectName: razorpay-key-secret
          objectType: secret
        - |
          objectName: razorpay-webhook-secret
          objectType: secret
  # Also syncs into a native k8s Secret, so the three RAZORPAY_* env vars
  # payment-service/config/validateEnv.js requires can be wired via envFrom
  # (see base/deployment.yaml) without the app knowing about the CSI mount.
  secretObjects:
    - secretName: payment-service-razorpay
      type: Opaque
      data:
        - objectName: razorpay-key-id
          key: RAZORPAY_KEY_ID
        - objectName: razorpay-key-secret
          key: RAZORPAY_KEY_SECRET
        - objectName: razorpay-webhook-secret
          key: RAZORPAY_WEBHOOK_SECRET
