apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base
  - secretproviderclass.yaml

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: azure
    includeSelectors: false

images:
  - name: homeease/payment-service
    newName: acrhomeeasedev.azurecr.io/homeease/payment-service
    # Built by the real Azure DevOps CI pipeline from commit 8af82121
    # ("feat: improve payment service validation and CI") — supersedes
    # the earlier manual 5d4e71d3fcd2-payment-fix build.
    newTag: 8af8212190cc

patches:
  # Azure AD Workload Identity: the client-id annotation tells the identity
  # federation which Azure AD app this ServiceAccount maps to.
  - target:
      kind: ServiceAccount
      name: payment-service
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: payment-service
        labels:
          azure.workload.identity/use: "true"
        annotations:
          azure.workload.identity/client-id: "8c163fcc-20af-4071-a7c1-6758d7902866" # id-homeease-payment-dev
  # Required on the POD itself, not just the ServiceAccount — the workload
  # identity mutating webhook checks this label here before it will inject
  # the federated-token projected volume.
  - target:
      kind: Deployment
      name: payment-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
