# See apps/backend/values.yaml and charts/common/values.yaml for why
# this file is fully self-contained.
#
# payment-service gets more here than the other three services —
# it's the one place a mistake has a real (simulated) financial
# consequence, so its blast radius is deliberately smaller. See the
# NetworkPolicy and secretProviderClass sections below.

nameOverride: ""
fullnameOverride: ""
environment: dev

image:
  repository: acrhomeeasedev.azurecr.io/homeease/payment-service
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  labels: {}
  annotations: {}

# TODO (follow-up, infra repo): this points at the shared
# "homeease" workload identity for now, the same one backend and
# admin-backend use. The hardening principle — "Key Vault access
# limited to what payment-service requires" — isn't fully met until
# this is its OWN identity, federated only for this service account,
# with Key Vault access scoped to only the Razorpay secrets. That's
# a new module.workload_identity_payment block in
# terraform/azure/environments/dev/main.tf, deliberately not done in
# this pass — it's an infra-repo change, not a GitOps-repo one, and
# doesn't belong in the same task as building this chart.
workloadIdentity:
  enabled: true
  clientId: "REPLACE-WITH-WORKLOAD-IDENTITY-CLIENT-ID"   # terraform output workload_identity_client_id, until the dedicated identity above exists

podLabels: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 5002
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# No HPA on CPU/memory for payment traffic — noted in the plan as a
# later "scale on request queue depth" candidate, not something to
# fake with a CPU target that doesn't reflect payment load.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 24

env: []
# Populated by the CSI driver's secretObjects sync below — the app
# reads RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
# from process.env exactly as it already does locally via .env; it
# never needs to know these came from a CSI mount.
envFrom:
  - secretRef:
      name: payment-service-razorpay
volumes: []
volumeMounts: []
extraVolumes: []
extraVolumeMounts: []

# Mounted at /mnt/secrets-store, read-only, by the Secrets Store CSI
# driver (AKS-managed add-on — see platform/README.md). Object names
# match exactly what payment-service/config/validateEnv.js requires
# at startup: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET,
# RAZORPAY_WEBHOOK_SECRET.
secretProviderClass:
  enabled: true
  keyvaultName: "REPLACE-WITH-KEYVAULT-NAME"     # e.g. kv-homeease-dev-hs01 — terraform output key_vault_name
  tenantId: "REPLACE-WITH-AZURE-TENANT-ID"
  objects:
    - objectName: RAZORPAY-KEY-ID
      objectType: secret
    - objectName: RAZORPAY-KEY-SECRET
      objectType: secret
    - objectName: RAZORPAY-WEBHOOK-SECRET
      objectType: secret
  # Sync into a native k8s Secret too, so the three RAZORPAY_* names
  # the app actually reads from process.env can be wired via envFrom
  # without the app needing to know about the CSI mount path at all.
  secretObjects:
    - secretName: payment-service-razorpay
      type: Opaque
      data:
        - objectName: RAZORPAY-KEY-ID
          key: RAZORPAY_KEY_ID
        - objectName: RAZORPAY-KEY-SECRET
          key: RAZORPAY_KEY_SECRET
        - objectName: RAZORPAY-WEBHOOK-SECRET
          key: RAZORPAY_WEBHOOK_SECRET

# Default-deny, explicit-allow. The ONLY caller of payment-service in
# the whole system is backend (verified against
# backend/services/payment/paymentClient.js — admin-backend and
# frontend never call it directly, and Razorpay's webhook lands on
# backend, which forwards it internally rather than reaching
# payment-service from outside the cluster). So: allow ingress from
# backend's pods only, in this namespace, on the app port. Nothing
# else — not admin-backend, not frontend, not the internet.
#
# Requires Azure NPM or Calico enabled at cluster creation for
# NetworkPolicy to actually be enforced, not just accepted by the
# API — CNI Overlay alone only handles addressing.
#
# Revisit if/when ingress-nginx is added and Razorpay is switched to
# call a webhook endpoint on payment-service directly: that would
# need a second ingress rule scoped to the ingress-nginx namespace
# and the /api/payments/webhook path specifically, not a blanket
# allow.
networkPolicy:
  enabled: true
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 5002
  egress: []

priorityClassName: ""
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
