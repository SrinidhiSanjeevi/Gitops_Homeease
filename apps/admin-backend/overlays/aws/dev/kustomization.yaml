apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: aws
    includeSelectors: false

images:
  - name: homeease/admin-backend
    newName: REPLACE-WITH-ACCOUNT-ID.dkr.ecr.REPLACE-WITH-REGION.amazonaws.com/homeease/admin-backend
    newTag: REPLACE-WITH-GIT-SHA

patches:
  - target:
      kind: Ingress
      name: admin-backend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: admin.dev.aws.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin.dev.aws.example.com
