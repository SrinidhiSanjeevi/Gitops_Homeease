apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeease-dev

resources:
  - ../../../base
  - secretproviderclass.yaml

labels:
  - pairs:
      homeease.io/environment: dev
      homeease.io/cloud: azure
    includeSelectors: false

images:
  - name: homeease/admin-backend
    newName: acrhomeeasedev.azurecr.io/homeease/admin-backend
    newTag: 5d4e71d3fcd2

patches:
  - target:
      kind: Ingress
      name: admin-backend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: admin.dev.azure.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin.dev.azure.example.com
  # Azure AD Workload Identity: the client-id annotation tells the identity
  # federation which Azure AD app this ServiceAccount maps to.
  - target:
      kind: ServiceAccount
      name: admin-backend
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: admin-backend
        labels:
          azure.workload.identity/use: "true"
        annotations:
          azure.workload.identity/client-id: "89286efc-8fa8-4e09-9664-a3b86fdeff89"
  # Required on the POD itself, not just the ServiceAccount — the workload
  # identity mutating webhook checks this label here before it will inject
  # the federated-token projected volume.
  - target:
      kind: Deployment
      name: admin-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: admin-backend
      spec:
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
