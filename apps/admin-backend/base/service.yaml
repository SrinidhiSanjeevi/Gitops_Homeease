apiVersion: v1
kind: Service
metadata:
  name: admin-backend
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: homeease
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-backend
  ports:
    # Matches the container's port (5001), not 80 — frontend's nginx.conf
    # upstream block hardcodes `server admin-backend:5001;`, and Ingress
    # references this port by name ("http"), not by number, so this is
    # safe to set to whatever the app actually listens on.
    - name: http
      port: 5001
      targetPort: http
      protocol: TCP
