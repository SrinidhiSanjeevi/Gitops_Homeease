# See apps/backend/values.yaml and charts/common/values.yaml for why
# this file is fully self-contained.

nameOverride: ""
fullnameOverride: ""
environment: dev

image:
  repository: acrhomeeasedev.azurecr.io/homeease/admin-backend
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  labels: {}
  annotations: {}

workloadIdentity:
  enabled: false
  clientId: ""

podLabels: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 5001
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 24

env: []
envFrom: []
volumes: []
volumeMounts: []
extraVolumes: []
extraVolumeMounts: []

secretProviderClass:
  enabled: false
  keyvaultName: ""
  tenantId: ""
  objects: []
  secretObjects: []

networkPolicy:
  enabled: false
  policyTypes: []
  ingress: []
  egress: []

priorityClassName: ""
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
