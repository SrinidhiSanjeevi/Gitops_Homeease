name: docs-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-doc-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check documented paths exist
        run: python3 .github/scripts/check_doc_paths.py
