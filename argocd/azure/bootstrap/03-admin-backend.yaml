apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-backend-dev
  namespace: argocd
  labels:
    homeease.io/service: admin-backend
    homeease.io/environment: dev
spec:
  project: homeease
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    # Migrated from Kustomize to this Helm chart — see root README.md.
    path: charts/admin-backend
    helm:
      valueFiles:
        - values-azure-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A fresh cluster has transient failures (project/CRD not there yet);
    # without retry an automated sync stays failed until the next commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
