apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-backend-dev
  namespace: argocd
  labels:
    homeease.io/service: admin-backend
    homeease.io/environment: dev
spec:
  project: homeease
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    # Migrated from apps/admin-backend/overlays/azure/dev (Kustomize) to
    # this Helm chart — Phase 3 validation confirmed 33/33 rendered
    # resources identical across all 4 services, zero functional
    # differences, exact selector matches against the live cluster.
    # Kustomize path kept in the repo (not deleted yet) until this
    # cutover is verified live.
    path: charts/admin-backend
    helm:
      valueFiles:
        - values-azure-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
