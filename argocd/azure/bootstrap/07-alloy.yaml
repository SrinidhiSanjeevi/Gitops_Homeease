# Same multi-source pattern as 05-kube-prometheus-stack.yaml.
# platform/alloy/values.yaml is shared with the AWS cluster's copy of this
# Application; not touched as part of this cloud-split.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "1.12.1"
      helm:
        valueFiles:
          - $values/platform/alloy/values.yaml
    - repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
