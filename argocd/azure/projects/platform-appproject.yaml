# AppProject scoping what platform Applications (Prometheus, Loki, Alloy) are allowed to do.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster platform components on AKS — Prometheus, Grafana, Alertmanager, Loki, Alloy

  # This repo plus the exact Helm repos these Applications pull from.
  sourceRepos:
    - "https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "monitoring"

  # Cluster-scoped resources platform genuinely needs; anything else stays denied.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "monitoring.coreos.com"
      kind: "*"

  # Not restricted namespace-scoped; the real risk is fenced above at cluster scope.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: readonly
      description: Read-only access for viewing sync status and history
      policies:
        - p, proj:platform:readonly, applications, get, platform/*, allow
      groups: []
