apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-aws
  namespace: argocd
spec:
  description: Cluster platform components on EKS — Prometheus, Grafana, Alertmanager, Loki, Alloy

  sourceRepos:
    - "https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"

  destinations:
    - name: eks-dev
      namespace: "monitoring"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "monitoring.coreos.com"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: readonly
      description: Read-only access for viewing sync status and history
      policies:
        - p, proj:platform-aws:readonly, applications, get, platform-aws/*, allow
      groups: []
