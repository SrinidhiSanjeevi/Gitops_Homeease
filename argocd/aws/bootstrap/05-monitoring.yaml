apiVersion: argoproj.io/v1alpha1
kind: Application
# AWS: same stack as Azure minus the dora-exporter, which reads Azure DevOps history. A GitHub Actions
# DORA exporter is a follow-up; the DORA dashboard stays installed but empty until then.
metadata:
  name: monitoring-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform-aws
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "90.0.0"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/kube-prometheus-stack/values.yaml
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "7.3.0"
      helm:
        releaseName: loki
        valueFiles:
          - $values/platform/loki/values.yaml
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "1.12.1"
      helm:
        releaseName: alloy
        valueFiles:
          - $values/platform/alloy/values.yaml
    - repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
      targetRevision: main
      path: platform/kube-prometheus-stack/dashboards
    - repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
      targetRevision: main
      ref: values
  destination:
    name: eks-dev
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
