# Same multi-source pattern as ../../azure/bootstrap/05-kube-prometheus-stack.yaml.
# platform/kube-prometheus-stack/values.yaml is shared between both
# clouds' copies of this Application — one values file, installed
# independently on both clusters.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "90.0.0"
      helm:
        valueFiles:
          - $values/platform/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
