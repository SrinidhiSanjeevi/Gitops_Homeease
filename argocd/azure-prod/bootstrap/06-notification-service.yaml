apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service-prod
  namespace: argocd
  labels:
    homeease.io/service: notification-service
    homeease.io/environment: prod
spec:
  project: homeease
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/notification-service
    helm:
      valueFiles:
        - values-azure-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
