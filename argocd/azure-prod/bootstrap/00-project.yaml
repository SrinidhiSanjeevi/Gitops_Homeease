# Syncs the prod AppProject from argocd/azure-prod/projects/ — same
# pattern as argocd/azure/bootstrap/00-project.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeease-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: argocd/azure-prod/projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
