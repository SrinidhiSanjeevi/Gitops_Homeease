# PROD twin of argocd/azure/bootstrap/01-frontend.yaml: same chart, values-azure-prod.yaml and namespace homeease-prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
  labels:
    homeease.io/service: frontend
    homeease.io/environment: prod
spec:
  project: homeease
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/frontend
    helm:
      valueFiles:
        - values-azure-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A fresh cluster has transient failures (project/CRD not there yet);
    # without retry an automated sync stays failed until the next commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
