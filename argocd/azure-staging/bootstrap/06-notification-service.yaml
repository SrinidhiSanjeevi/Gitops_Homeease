# STAGING twin of argocd/azure/bootstrap/07-notification-service.yaml.
# Same cluster as dev — see 01-frontend.yaml's header for the Phase 1
# rationale. NOTE: notification-service has no real workload identity in
# ANY environment yet (values-azure-staging.yaml still carries the same
# REPLACE_ME placeholders as values-azure-dev.yaml) — this Application
# exists so the chart is wired up consistently with its 5 siblings, but
# actually syncing it will only succeed once that placeholder is filled
# in (same precondition as dev).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service-staging
  namespace: argocd
  labels:
    homeease.io/service: notification-service
    homeease.io/environment: staging
spec:
  project: homeease-staging
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/notification-service
    helm:
      valueFiles:
        - values-azure-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A fresh cluster has transient failures (project/CRD not there yet);
    # without retry an automated sync stays failed until the next commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
