# STAGING twin of argocd/azure/bootstrap/06-admin-frontend.yaml. Same
# cluster as dev — see 01-frontend.yaml's header for the Phase 1
# rationale. Numbered 05 (not 06) here since staging has no separate
# monitoring Application (05-monitoring.yaml in dev is a platform-wide,
# not per-environment, Application — it is not duplicated per
# environment).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-frontend-staging
  namespace: argocd
  labels:
    homeease.io/service: admin-frontend
    homeease.io/environment: staging
spec:
  project: homeease-staging
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/admin-frontend
    helm:
      valueFiles:
        - values-azure-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A fresh cluster has transient failures (project/CRD not there yet);
    # without retry an automated sync stays failed until the next commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
