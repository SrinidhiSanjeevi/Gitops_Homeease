# STAGING twin of argocd/azure/bootstrap/01-frontend.yaml. Same cluster
# as dev (Phase 1: homeease-staging namespace on aks-homeease-dev, no
# second cluster), so this is live/synced automatically like dev — unlike
# argocd/azure-prod, which targets a not-yet-applied separate cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
  labels:
    homeease.io/service: frontend
    homeease.io/environment: staging
spec:
  project: homeease-staging
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/frontend
    helm:
      valueFiles:
        - values-azure-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A fresh cluster has transient failures (project/CRD not there yet);
    # without retry an automated sync stays failed until the next commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
