# STAGING twin of argocd/azure/bootstrap/02-backend.yaml, same aks-homeease-dev cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-staging
  namespace: argocd
  labels:
    homeease.io/service: backend
    homeease.io/environment: staging
spec:
  project: homeease-staging
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/backend
    helm:
      valueFiles:
        - values-azure-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A fresh cluster has transient failures (project/CRD not there yet);
    # without retry an automated sync stays failed until the next commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
