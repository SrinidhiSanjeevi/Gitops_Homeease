apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-backend-staging
  namespace: argocd
  labels:
    homeease.io/service: admin-backend
    homeease.io/environment: staging
spec:
  project: homeease-staging
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: charts/admin-backend
    helm:
      valueFiles:
        - values-azure-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
