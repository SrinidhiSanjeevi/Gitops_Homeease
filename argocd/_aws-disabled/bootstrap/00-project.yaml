apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeease-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: argocd/aws/projects
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
