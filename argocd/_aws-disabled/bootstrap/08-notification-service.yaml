apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service-dev
  namespace: argocd
  labels:
    homeease.io/service: notification-service
    homeease.io/environment: dev
spec:
  project: homeease
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/Gitops_Homeease.git
    targetRevision: main
    path: apps/notification-service/overlays/aws/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: homeease-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
