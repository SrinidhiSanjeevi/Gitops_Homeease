# Apply once, out of band:  kubectl apply -f platform/cert-manager/clusterissuers.yaml
# Two issuers because the HTTP-01 challenge must be answered by the same controller that owns the
# hostname's IP: "nginx" serves the app, "nginx-admin" serves the admin console.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: srinidhip.s@zapcg.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-admin
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: srinidhip.s@zapcg.com
    privateKeySecretRef:
      name: letsencrypt-admin
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx-admin
