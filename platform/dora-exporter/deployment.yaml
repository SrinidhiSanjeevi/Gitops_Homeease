apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dora-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dora-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dora-exporter
      annotations:
        checksum/script: 82d8286f7d06f67e
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: exporter
        image: python:3.12-alpine
        command:
        - python
        - -u
        - /app/exporter.py
        ports:
        - name: metrics
          containerPort: 9102
        env:
        - name: ADO_ORG
          value: homeease
        - name: ADO_PROJECT
          value: HomeEase
        - name: GH_REPO
          value: SrinidhiSanjeevi/app_Homeease
        - name: WINDOW_DAYS
          value: '30'
        - name: REFRESH_SECONDS
          value: '300'
        - name: ADO_PAT
          valueFrom:
            secretKeyRef:
              name: dora-exporter
              key: ado-pat
              optional: true
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: dora-exporter
              key: github-token
              optional: true
        volumeMounts:
        - name: script
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 30
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: script
        configMap:
          name: dora-exporter-script
