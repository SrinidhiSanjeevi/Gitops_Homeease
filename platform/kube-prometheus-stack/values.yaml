prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    retention: 15d

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    secrets:
      - alertmanager-smtp

  # EMAIL ONLY. The Gmail app password lives in the `alertmanager-smtp` Secret (key `password`), mounted at
  # /etc/alertmanager/secrets/alertmanager-smtp/ and read through smtp_auth_password_file. Never put it here.
  # Create/rotate it out of band (see docs/monitoring-secrets.md).
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: adminuserproduct01@gmail.com
      smtp_auth_username: adminuserproduct01@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      # Default: DevOps engineer only. This is where warnings (and anything unlabelled) go.
      receiver: devops-email
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # Time-based escalation. Alertmanager cannot escalate to a different person on its own
        # (repeat_interval only re-sends to the SAME receiver), so Prometheus raises these two meta-alerts
        # when a critical alert has been firing for 15 / 30 minutes (see CriticalUnresolved* in homeease-alerts).
        - receiver: lead-email
          matchers:
            - escalation = "lead"
          group_wait: 10s
        - receiver: manager-email
          matchers:
            - escalation = "manager"
          group_wait: 10s
        # Critical alerts notify the DevOps engineer immediately.
        - receiver: devops-email
          matchers:
            - severity = "critical"
          group_wait: 10s
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['namespace', 'alertname']
    receivers:
      - name: 'null'
      - name: devops-email
        email_configs:
          - to: adminuserproduct01@gmail.com
            send_resolved: true
            headers:
              subject: '[HomeEase {{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
      - name: lead-email
        email_configs:
          - to: srinidhisanjeevi@gmail.com
            send_resolved: true
            headers:
              subject: '[HomeEase ESCALATION {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
      - name: manager-email
        email_configs:
          - to: srinidhip.s@zapcg.com
            send_resolved: true
            headers:
              subject: '[HomeEase ESCALATION {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  containerSecurityContext:
    readOnlyRootFilesystem: false

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
