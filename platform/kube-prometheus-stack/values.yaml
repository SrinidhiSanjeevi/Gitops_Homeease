# ============================================================
# kube-prometheus-stack — Prometheus Operator + Prometheus +
# Alertmanager + Grafana + node-exporter + kube-state-metrics.
#
# Sized for a 1-3 node Standard_D2s_v5 dev cluster (2 vCPU / 8GB per
# node) on trial credit, not a production fleet. Bump requests/limits
# when Grafana shows sustained throttling, not before — guessing high
# "to be safe" is how a monitoring stack eats the budget it exists to
# protect.
# ============================================================

# ------------------------------------------------------------
# THE LINE THAT MATTERS MOST IN THIS FILE.
#
# By default this chart's Prometheus only watches ServiceMonitors
# carrying ITS OWN Helm release label — meaning ServiceMonitors added
# later by the four HomeEase app charts (a different Helm release
# entirely) would silently never be scraped. Setting these to false
# makes Prometheus watch every ServiceMonitor/PodMonitor/
# PrometheusRule in the cluster, in any namespace, regardless of who
# created it.
# ------------------------------------------------------------
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    retention: 15d

    resources:
      requests:
        cpu: 100m # was 200m — DEV is one 2-vCPU node (Free Trial 4-vCPU cap)
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # Single replica — this is a dev cluster, not an HA control plane.
  # Revisit if this is ever pushed toward a real multi-node prod.
  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    # Secret alertmanager-slack is mounted only when created out-of-band.
    # See docs/monitoring-secrets.md for manual creation instructions.
    # Uncomment below once the secret exists in the monitoring namespace:
    # secrets:
    #   - alertmanager-slack

  # Routing: default to null receiver until Slack secret is created.
  # Once alertmanager-slack is created, set receiver to 'slack-default'
  # and uncomment the slack_configs receiver below.
  config:
    route:
      receiver: 'null'
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      # To enable Slack notifications after creating alertmanager-slack secret:
      # - name: 'slack-default'
      #   slack_configs:
      #     - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
      #       channel: '#homeease-alerts'
      #       send_resolved: true

grafana:
  # Use pre-existing / out-of-band secret instead of auto-generating a random
  # password during every Helm render (which creates continuous drift in ArgoCD).
  # See docs/monitoring-secrets.md for details.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # Grafana 13 (distroless) moves its bundled plugins (Prometheus, Loki, …)
  # at startup. With a read-only root filesystem that move fails
  # ("unlinkat /usr/share/grafana/data/plugins-bundled/...: read-only file
  # system") and Grafana ends up with NO Prometheus/Loki plugin — every
  # dashboard panel then errors with "No data". Everything else in the
  # chart's default security context (non-root, no privilege escalation,
  # all capabilities dropped) stays in place.
  containerSecurityContext:
    readOnlyRootFilesystem: false

  # Declarative dashboards: the sidecar watches for ConfigMaps carrying
  # the label below (any namespace — this is a dev cluster, not multi-
  # tenant) and loads/updates/removes them from Grafana automatically.
  # This is how platform/kube-prometheus-stack/dashboards/*.yaml reach
  # Grafana — no manual "Import Dashboard" click, no dashboard drift
  # from what's committed here.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Loki as a second datasource, alongside the Prometheus one this
  # chart wires automatically — one Grafana, both signals, same
  # label set (namespace, service) so a panel can pivot from a
  # metric to its logs without leaving the UI.
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy

  # No ingress yet — nothing in front of the cluster to attach a
  # hostname to (see platform/README.md on ingress-nginx). Reach
  # Grafana with:
  #   kubectl port-forward -n monitoring svc/kube-prometheus-stack-grafana 3000:80

# ------------------------------------------------------------
# AKS Control Plane Monitoring
# Control plane components (controller-manager, scheduler, etcd, kube-proxy)
# are managed by Azure and not accessible from worker nodes. Disabling them
# avoids trying to scrape inaccessible endpoints and avoids creating headless
# services in kube-system (which is restricted in the platform AppProject).
# Full cluster & node observability is maintained via kubelet, apiserver,
# kube-state-metrics, and node-exporter.
# ------------------------------------------------------------
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false

# node-exporter and kube-state-metrics keep their chart defaults —
# both are already small (DaemonSet / single Deployment) and don't
# need dev-specific tuning.

