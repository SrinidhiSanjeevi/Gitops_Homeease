# kube-prometheus-stack — Prometheus Operator + Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics. Sized for a small dev cluster.

# Watch ServiceMonitors/PodMonitors/PrometheusRules cluster-wide, not just this Helm release's own.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    retention: 15d

    resources:
      requests:
        cpu: 100m # was 200m — DEV is one 2-vCPU node (Free Trial 4-vCPU cap)
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # Single replica — dev cluster, not an HA control plane.
  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    # Out-of-band secret (docs/monitoring-secrets.md); mount is mandatory or the pod sticks in Init.
    secrets:
      - alertmanager-teams

  # Single route: every alert (except the Watchdog heartbeat) goes to the one Teams webhook.
  config:
    route:
      receiver: teams-monitoring
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    # Don't post the warning when the critical version of the same alert
    # is already firing.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['namespace', 'alertname']
    receivers:
      - name: 'null'
      - name: teams-monitoring
        msteamsv2_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-teams/monitoring-url
            send_resolved: true

grafana:
  # Pre-existing/out-of-band secret instead of an auto-generated password (see docs/monitoring-secrets.md).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # Read-only root filesystem breaks Grafana 13's bundled-plugin move at startup, so it's disabled here.
  containerSecurityContext:
    readOnlyRootFilesystem: false

  # Sidecar auto-loads dashboards from ConfigMaps carrying the label below.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Loki as a second datasource alongside the auto-wired Prometheus one.
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy

  # No ingress yet — reach Grafana via kubectl port-forward (see platform/README.md).

# AKS control plane components are Azure-managed and not scrapeable — disabled here.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false

# node-exporter and kube-state-metrics keep their chart defaults.

