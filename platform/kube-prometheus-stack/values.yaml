# ============================================================
# kube-prometheus-stack — Prometheus Operator + Prometheus +
# Alertmanager + Grafana + node-exporter + kube-state-metrics.
#
# Sized for a 1-3 node Standard_D2s_v5 dev cluster (2 vCPU / 8GB per
# node) on trial credit, not a production fleet. Bump requests/limits
# when Grafana shows sustained throttling, not before — guessing high
# "to be safe" is how a monitoring stack eats the budget it exists to
# protect.
# ============================================================

# ------------------------------------------------------------
# THE LINE THAT MATTERS MOST IN THIS FILE.
#
# By default this chart's Prometheus only watches ServiceMonitors
# carrying ITS OWN Helm release label — meaning ServiceMonitors added
# later by the four HomeEase app charts (a different Helm release
# entirely) would silently never be scraped. Setting these to false
# makes Prometheus watch every ServiceMonitor/PodMonitor/
# PrometheusRule in the cluster, in any namespace, regardless of who
# created it.
# ------------------------------------------------------------
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    retention: 15d

    resources:
      requests:
        cpu: 100m # was 200m — DEV is one 2-vCPU node (Free Trial 4-vCPU cap)
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # Single replica — this is a dev cluster, not an HA control plane.
  # Revisit if this is ever pushed toward a real multi-node prod.
  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    # Created out-of-band (docs/monitoring-secrets.md) and mounted at
    # /etc/alertmanager/secrets/alertmanager-teams/. The mount is mandatory:
    # if the Secret is missing, the Alertmanager pod sticks in Init.
    #   alertmanager-teams: monitoring-url, infrastructure-url, incidents-url
    #                       (Teams Workflows webhook URLs, one per channel)
    # Teams-only for now (Option B) — no Outlook/SMTP secret required.
    # To add email later without an SMTP mailbox: add a "Send an email
    # (V2)" step to the #incidents Teams Workflow in Power Automate, after
    # its "when a webhook is received" trigger. To add it via Alertmanager
    # SMTP instead: add `alertmanager-smtp` here, restore `global.smtp_*`
    # (see git history of this file) and add `email_configs` back to the
    # incidents-l1/l2 receivers below.
    secrets:
      - alertmanager-teams

  # Routing, mapped to the HomeEase Teams channels:
  #   monitoring-alerts : every alert when it first fires (default route)
  #   infrastructure    : cluster/platform alerts (nodes, disks, certs)
  #   incidents         : escalations (Teams only — see the Option B note above)
  #     L1 = critical still firing after 10 min  -> on-call
  #     L2 = critical still firing after 12 h    -> lead/manager
  # The escalation labels come from the homeease-escalation PrometheusRule,
  # which re-fires on the ALERTS metric with `for: 10m` / `for: 12h`.
  # Routes are first-match, so the escalation routes sit above the rest.
  config:
    route:
      receiver: teams-monitoring
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: incidents-l2
          matchers:
            - escalation = "l2"
          repeat_interval: 12h
        - receiver: incidents-l1
          matchers:
            - escalation = "l1"
          repeat_interval: 1h
        - receiver: teams-infra
          matchers:
            - alertname =~ "KubeNode.*|KubePersistentVolume.*|NodeFilesystem.*|KubeletDown|KubeAPIDown|KubeQuotaExceeded|CertificateExpiring"
    # Don't post the warning when the critical version of the same alert
    # is already firing.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['namespace', 'alertname']
    receivers:
      - name: 'null'
      - name: teams-monitoring
        msteamsv2_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-teams/monitoring-url
            send_resolved: true
      - name: teams-infra
        msteamsv2_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-teams/infrastructure-url
            send_resolved: true
      - name: incidents-l1
        msteamsv2_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-teams/incidents-url
            send_resolved: true
      - name: incidents-l2
        msteamsv2_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-teams/incidents-url
            send_resolved: true

grafana:
  # Use pre-existing / out-of-band secret instead of auto-generating a random
  # password during every Helm render (which creates continuous drift in ArgoCD).
  # See docs/monitoring-secrets.md for details.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # Grafana 13 (distroless) moves its bundled plugins (Prometheus, Loki, …)
  # at startup. With a read-only root filesystem that move fails
  # ("unlinkat /usr/share/grafana/data/plugins-bundled/...: read-only file
  # system") and Grafana ends up with NO Prometheus/Loki plugin — every
  # dashboard panel then errors with "No data". Everything else in the
  # chart's default security context (non-root, no privilege escalation,
  # all capabilities dropped) stays in place.
  containerSecurityContext:
    readOnlyRootFilesystem: false

  # Declarative dashboards: the sidecar watches for ConfigMaps carrying
  # the label below (any namespace — this is a dev cluster, not multi-
  # tenant) and loads/updates/removes them from Grafana automatically.
  # This is how platform/kube-prometheus-stack/dashboards/*.yaml reach
  # Grafana — no manual "Import Dashboard" click, no dashboard drift
  # from what's committed here.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Loki as a second datasource, alongside the Prometheus one this
  # chart wires automatically — one Grafana, both signals, same
  # label set (namespace, service) so a panel can pivot from a
  # metric to its logs without leaving the UI.
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy

  # No ingress yet — nothing in front of the cluster to attach a
  # hostname to (see platform/README.md on ingress-nginx). Reach
  # Grafana with:
  #   kubectl port-forward -n monitoring svc/kube-prometheus-stack-grafana 3000:80

# ------------------------------------------------------------
# AKS Control Plane Monitoring
# Control plane components (controller-manager, scheduler, etcd, kube-proxy)
# are managed by Azure and not accessible from worker nodes. Disabling them
# avoids trying to scrape inaccessible endpoints and avoids creating headless
# services in kube-system (which is restricted in the platform AppProject).
# Full cluster & node observability is maintained via kubelet, apiserver,
# kube-state-metrics, and node-exporter.
# ------------------------------------------------------------
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false

# node-exporter and kube-state-metrics keep their chart defaults —
# both are already small (DaemonSet / single Deployment) and don't
# need dev-specific tuning.

