apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-payment-service-dashboard
  labels:
    grafana_dashboard: '1'
data:
  homeease-payment-service.json: |
    {
      "title": "HomeEase - Payment Service",
      "uid": "homeease-payment-service",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Payment Service",
          "description": "Binary UP/DOWN for the payment-service Prometheus target",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "min(up{job=\"payment-service\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 2,
          "title": "Total Payments (all time)",
          "description": "Every payment record in MongoDB Atlas. Survives pod restarts.",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "sum(max by (status) (payment_records_by_status{job=\"payment-service\"}))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 3,
          "title": "Successful Payments (all time)",
          "description": "Razorpay payments verified as successful, from the database.",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "max(payment_records_by_status{job=\"payment-service\",status=\"Success\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 4,
          "title": "Failed Payments (all time)",
          "description": "Declined/failed Razorpay payments recorded in the database.",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "max(payment_records_by_status{job=\"payment-service\",status=\"Failure\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 5,
          "title": "Refunds (all time)",
          "description": "Total refunds processed in the selected time window (integer count)",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "max(payment_records_by_status{job=\"payment-service\",status=\"Refunded\"}) + max(payment_records_by_status{job=\"payment-service\",status=\"Partially Refunded\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 6,
          "title": "Payment Success Rate (all time)",
          "description": "% of payment orders successfully verified in the last 15 minutes",
          "type": "gauge",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              },
              "noValue": "No payments yet"
            }
          },
          "targets": [
            {
              "expr": "100 * max(payment_records_by_status{job=\"payment-service\",status=\"Success\"}) / ((max(payment_records_by_status{job=\"payment-service\",status=\"Success\"}) + max(payment_records_by_status{job=\"payment-service\",status=\"Failure\"})) > 0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 7,
          "title": "Payment Failure Rate (all time)",
          "description": "% of payment orders that failed verification in the last 15 minutes",
          "type": "gauge",
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 8,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 15
                  }
                ]
              },
              "noValue": "No payments yet"
            }
          },
          "targets": [
            {
              "expr": "100 * max(payment_records_by_status{job=\"payment-service\",status=\"Failure\"}) / ((max(payment_records_by_status{job=\"payment-service\",status=\"Success\"}) + max(payment_records_by_status{job=\"payment-service\",status=\"Failure\"})) > 0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 8,
          "title": "Revenue Collected (\u20b9)",
          "description": "Sum of successful payment amounts in the database.",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyINR",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "max(payment_amount_rupees_by_status{job=\"payment-service\",status=\"Success\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 9,
          "title": "Payment Latency P50 (HTTP)",
          "description": "50th percentile HTTP request duration for payment-service",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "No traffic"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 10,
          "title": "Available Replicas",
          "description": "Current available replicas of the payment-service deployment",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"homeease-dev\", deployment=\"payment-service\"}",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 11,
          "title": "Payment Latency P95 (HTTP)",
          "description": "95th percentile HTTP request duration for payment-service",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "No traffic"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 12,
          "title": "Payment Latency P99 (HTTP)",
          "description": "99th percentile HTTP request duration for payment-service",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "noValue": "No traffic"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 13,
          "title": "Payment Processing Latency P95",
          "description": "95th percentile of payment_processing_duration_seconds (create_order, verify_payment, refund) \u2014 shows 'No data' until paymentController.js has served real requests",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "noValue": "No activity"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(payment_processing_duration_seconds_bucket{job=\"payment-service\"}[15m])) by (le))",
              "legendFormat": "{{operation}}"
            }
          ]
        },
        {
          "id": 14,
          "title": "HTTP 4xx Errors",
          "description": "Rate of 4xx HTTP errors from payment-service",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 15,
            "w": 8,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.05
                  },
                  {
                    "color": "red",
                    "value": 0.2
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"payment-service\", code=~\"4..\"}[5m])) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 15,
          "title": "HTTP 5xx Errors",
          "description": "Rate of 5xx HTTP errors from payment-service",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 15,
            "w": 8,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"payment-service\", code=~\"5..\"}[5m])) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 16,
          "title": "HTTP Request Rate",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 8,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"payment-service\"}[5m]))",
              "legendFormat": ""
            }
          ]
        }
      ]
    }
