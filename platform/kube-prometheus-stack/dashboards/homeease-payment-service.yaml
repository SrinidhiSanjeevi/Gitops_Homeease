# Grafana dashboard provisioning via the chart's sidecar — see
# grafana.sidecar.dashboards in ../values.yaml.
#
# Metric names copy-checked against app_Homeease/payment-service/metrics.js
# and confirmed actually incremented in controllers/paymentController.js
# (paymentOrderCreatedTotal, paymentVerifySuccessTotal,
# paymentVerifyFailedTotal, paymentRefundTotal — all real call sites, not
# dead code). Scrape config comes from
# gitops_homeease/apps/payment-service/base/servicemonitor.yaml (port
# "http", path /metrics) — job label = "payment-service".
#
# KEY FIX: KPI stat panels now use round(increase(counter[$__range])) to
# return integer counts over the selected time window, not rate(counter[5m])
# which produces very small decimal values (e.g. 0.0005 reqps).
#
# Row 1: Payment KPIs (integer counts over selected window)
# Row 2: Reliability % gauges
# Row 3: Payment Latency (HTTP + payment_processing_duration_seconds)
# Row 4: Infrastructure health
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-payment-service-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-payment-service.json: |
    {
      "title": "HomeEase - Payment Service",
      "uid": "homeease-payment-service",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Payment Service",
          "description": "Binary UP/DOWN for the payment-service Prometheus target",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "up{job=\"payment-service\"}", "legendFormat": "" }]
        },
        {
          "id": 10,
          "title": "Available Replicas",
          "description": "Current available replicas of the payment-service deployment",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"homeease-dev\", deployment=\"payment-service\"}", "legendFormat": "" }]
        },
        {
          "id": 2,
          "title": "Payment Attempts",
          "description": "Total payment orders created in the selected time window (integer count)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(payment_order_created_total{job=\"payment-service\"}[$__range])))", "legendFormat": "" }]
        },
        {
          "id": 3,
          "title": "Successful Payments",
          "description": "Total verified/successful payments in the selected time window (integer count)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "mode": "fixed", "fixedColor": "green" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(payment_verify_success_total{job=\"payment-service\"}[$__range])))", "legendFormat": "" }]
        },
        {
          "id": 4,
          "title": "Failed Payments",
          "description": "Total failed payment verifications in the selected time window (integer count)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "mode": "fixed", "fixedColor": "red" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(payment_verify_failed_total{job=\"payment-service\"}[$__range])))", "legendFormat": "" }]
        },
        {
          "id": 5,
          "title": "Refunds Processed",
          "description": "Total refunds processed in the selected time window (integer count)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(payment_refund_total{job=\"payment-service\"}[$__range])))", "legendFormat": "" }]
        },
        {
          "id": 6,
          "title": "Payment Success Rate (15m)",
          "description": "% of payment orders successfully verified in the last 15 minutes",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 80 }, { "color": "green", "value": 95 }]
              }
            }
          },
          "targets": [{ "expr": "100 * sum(rate(payment_verify_success_total{job=\"payment-service\"}[15m])) / clamp_min(sum(rate(payment_order_created_total{job=\"payment-service\"}[15m])), 1e-9)", "legendFormat": "" }]
        },
        {
          "id": 7,
          "title": "Payment Failure Rate (15m)",
          "description": "% of payment orders that failed verification in the last 15 minutes",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 15 }]
              }
            }
          },
          "targets": [{ "expr": "100 * sum(rate(payment_verify_failed_total{job=\"payment-service\"}[15m])) / clamp_min(sum(rate(payment_order_created_total{job=\"payment-service\"}[15m])), 1e-9)", "legendFormat": "" }]
        },
        {
          "id": 8,
          "title": "HTTP Request Rate",
          "description": "Current rate of HTTP requests to payment-service (reqps)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 4,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"payment-service\"}[5m]))", "legendFormat": "" }]
        },
        {
          "id": 9,
          "title": "Payment Latency P50 (HTTP)",
          "description": "50th percentile HTTP request duration for payment-service",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.3 }, { "color": "red", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))", "legendFormat": "" }]
        },
        {
          "id": 11,
          "title": "Payment Latency P95 (HTTP)",
          "description": "95th percentile HTTP request duration for payment-service",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))", "legendFormat": "" }]
        },
        {
          "id": 12,
          "title": "Payment Latency P99 (HTTP)",
          "description": "99th percentile HTTP request duration for payment-service",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 2 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))", "legendFormat": "" }]
        },
        {
          "id": 13,
          "title": "Payment Processing Latency P95",
          "description": "95th percentile of payment_processing_duration_seconds (create_order, verify_payment, refund) — shows 'No data' until paymentController.js has served real requests",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 2 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(payment_processing_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le, operation))", "legendFormat": "{{operation}}" }]
        },
        {
          "id": 14,
          "title": "HTTP 4xx Errors",
          "description": "Rate of 4xx HTTP errors from payment-service",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 4,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.05 }, { "color": "red", "value": 0.2 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"payment-service\", code=~\"4..\"}[5m]))", "legendFormat": "" }]
        },
        {
          "id": 15,
          "title": "HTTP 5xx Errors",
          "description": "Rate of 5xx HTTP errors from payment-service",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 4,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"payment-service\", code=~\"5..\"}[5m]))", "legendFormat": "" }]
        }
      ]
    }
