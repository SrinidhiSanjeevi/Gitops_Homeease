# See homeease-business.yaml for how sidecar provisioning works.
#
# http_requests_total / http_request_duration_seconds / http_requests_in_flight
# are defined identically (same names, same label set: method, route, code)
# in backend/metrics.js, admin-backend/metrics.js and payment-service/metrics.js
# — confirmed by reading all three files, not assumed. This dashboard
# aggregates across all three via the `job` label the ServiceMonitors give
# each one (backend / admin-backend / payment-service).
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-http-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-http.json: |
    {
      "title": "HomeEase HTTP Performance",
      "uid": "homeease-http",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "HTTP Request Rate by Service", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_total[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 2, "title": "Request Rate by Route", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_total[5m])) by (route)", "legendFormat": "{{route}}" }]
        },
        {
          "id": 3, "title": "2xx Rate", "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total{code=~\"2..\"}[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 4, "title": "4xx Rate", "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total{code=~\"4..\"}[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 5, "title": "5xx Rate", "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total{code=~\"5..\"}[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 6, "title": "Error Percentage (5xx / total)", "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } },
          "targets": [{ "expr": "100 * sum(rate(http_requests_total{code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)" }]
        },
        {
          "id": 7, "title": "P50 Latency", "type": "timeseries",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}" }]
        },
        {
          "id": 8, "title": "P95 Latency", "type": "timeseries",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}" }]
        },
        {
          "id": 9, "title": "P99 Latency", "type": "timeseries",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}" }]
        },
        {
          "id": 10, "title": "In-Flight Requests", "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 20 },
          "targets": [{ "expr": "sum(http_requests_in_flight) by (job)", "legendFormat": "{{job}}" }]
        }
      ]
    }
