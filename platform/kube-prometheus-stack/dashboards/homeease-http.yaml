# See homeease-business.yaml for how sidecar provisioning works.
#
# http_requests_total / http_request_duration_seconds / http_requests_in_flight
# are defined identically (same names, same label set: method, route, code)
# in backend/metrics.js, admin-backend/metrics.js and payment-service/metrics.js
# — confirmed by reading all three files, not assumed. This dashboard
# aggregates across all three via the `job` label the ServiceMonitors give
# each one (backend / admin-backend / payment-service).
#
# Redesigned as a compact, all-Stat/Gauge "Application Health" view (no
# time-series graphs) — same PromQL as before, just reduced to current
# values per service instead of trend lines. Route-level and P50 detail
# dropped here to avoid duplicating homeease-red.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-http-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-http.json: |
    {
      "title": "HomeEase HTTP Performance",
      "uid": "homeease-http",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "HTTP Request Rate (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 4, "title": "HTTP 4xx Errors (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.05 }, { "color": "red", "value": 0.2 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "(sum(rate(http_requests_total{code=~\"4..\"}[5m])) by (job)) or (up{job=~\"backend|admin-backend\"} * 0)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 5, "title": "HTTP 5xx Errors (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "(sum(rate(http_requests_total{code=~\"5..\"}[5m])) by (job)) or (up{job=~\"backend|admin-backend\"} * 0)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 6, "title": "Error Percentage (5xx / total)", "type": "gauge",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "max": 100, "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] }
            }
          },
          "targets": [{ "expr": "100 * (sum(rate(http_requests_total{code=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)" }]
        },
        {
          "id": 8, "title": "P95 Latency (by service)", "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}" }]
        },
        {
          "id": 9, "title": "P99 Latency (by service)", "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 2 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}" }]
        },
        {
          "id": 10, "title": "In-Flight Requests (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 11 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(http_requests_in_flight) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 11, "title": "Backend Target UP", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "up{job=~\"backend|admin-backend\"}", "legendFormat": "{{job}}" }]
        }
      ]
    }
