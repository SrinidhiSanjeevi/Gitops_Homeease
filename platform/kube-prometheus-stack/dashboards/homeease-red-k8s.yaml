# See homeease-business.yaml for how sidecar provisioning works.
#
# Kubernetes panels use kube-state-metrics + cAdvisor series that ship
# enabled by default in kube-prometheus-stack (kubeStateMetrics.enabled
# and kubelet.enabled are both chart defaults), scoped to
# namespace=homeease-dev.
#
# Redesigned as a compact, all-Stat "Kubernetes" view (no time-series
# graphs). The RED/HTTP panels that used to live here (Rate/Errors/
# Duration by service) were dropped — they duplicated homeease-http.yaml
# and homeease-red.yaml exactly. Title kept as-is for continuity; content
# is now purely Kubernetes-health, matching the "KUBERNETES" section of
# the requested layout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-red-k8s-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-red-k8s.json: |
    {
      "title": "HomeEase RED & Kubernetes",
      "uid": "homeease-red-k8s",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 14, "title": "Total Pods", "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "count(kube_pod_info{namespace=\"homeease-dev\"})" }]
        },
        {
          "id": 7, "title": "Running Pods", "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(kube_pod_status_phase{namespace=\"homeease-dev\", phase=\"Running\"})" }]
        },
        {
          "id": 15, "title": "Ready Pods", "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(kube_pod_status_ready{namespace=\"homeease-dev\", condition=\"true\"})" }]
        },
        {
          "id": 8, "title": "Available Replicas (by deployment)", "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"homeease-dev\"}", "legendFormat": "{{deployment}}" }]
        },
        {
          "id": 9, "title": "Pod Restarts (1h, by pod)", "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"homeease-dev\"}[1h])) by (pod)", "legendFormat": "{{pod}}" }]
        },
        {
          "id": 11, "title": "CPU Usage (cores, by pod)", "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"homeease-dev\", container!=\"\", container!=\"POD\"}[5m])) by (pod)", "legendFormat": "{{pod}}" }]
        },
        {
          "id": 12, "title": "Memory Usage (by pod)", "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"homeease-dev\", container!=\"\", container!=\"POD\"}) by (pod)", "legendFormat": "{{pod}}" }]
        }
      ]
    }
