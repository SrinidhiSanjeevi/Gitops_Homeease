# Grafana dashboard provisioning via the chart's sidecar — see grafana.sidecar.dashboards in ../values.yaml. Frontend is excluded: no /metrics route.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-red-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-red.json: |
    {
      "title": "HomeEase - RED Dashboard",
      "uid": "homeease-red",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 100, "title": "RATE", "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 1, "title": "Total HTTP Request Rate", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=~\"backend|admin-backend|payment-service\"}[5m]))" }]
        },
        {
          "id": 2, "title": "Request Rate (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=~\"backend|admin-backend|payment-service\"}[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 3, "title": "Request Rate (top 8 routes)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "topk(8, sum(rate(http_requests_total{job=~\"backend|admin-backend|payment-service\"}[5m])) by (job, route))", "legendFormat": "{{route}}" }]
        },

        {
          "id": 101, "title": "ERRORS", "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }
        },
        {
          "id": 4, "title": "Total 4xx Error Rate", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.05 }, { "color": "red", "value": 0.2 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{code=~\"4..\"}[5m])) or vector(0)" }]
        },
        {
          "id": 5, "title": "Total 5xx Error Rate", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{code=~\"5..\"}[5m])) or vector(0)" }]
        },
        {
          "id": 6, "title": "5xx Errors (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "(sum(rate(http_requests_total{job=~\"backend|admin-backend|payment-service\", code=~\"5..\"}[5m])) by (job)) or (max by (job) (up{job=~\"backend|admin-backend|payment-service\"}) * 0)", "legendFormat": "{{job}}" }]
        },

        {
          "id": 102, "title": "DURATION", "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 12 }
        },
        {
          "id": 7, "title": "HTTP Latency p95 (overall)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))" }]
        },
        {
          "id": 8, "title": "p95 Latency (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}" }]
        },
        {
          "id": 9, "title": "p95 Latency — Booking/Payment Routes", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route=~\".*(?i)(booking|payment|order).*\"}[5m])) by (le, route))",
            "legendFormat": "{{route}}"
          }]
        },

        {
          "id": 103, "title": "SERVICE HEALTH", "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "id": 10, "title": "Target UP/DOWN (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 12, "x": 0, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "min by (job) (up{job=~\"backend|admin-backend|payment-service\"})", "legendFormat": "{{job}}" }]
        },
        {
          "id": 11, "title": "Running Pod Count (by service)", "type": "stat",
          "gridPos": { "h": 5, "w": 12, "x": 12, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"homeease-dev\"}", "legendFormat": "{{deployment}}" }]
        }
      ]
    }
