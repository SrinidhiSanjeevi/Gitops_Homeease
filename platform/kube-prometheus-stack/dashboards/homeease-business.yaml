apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-business-dashboard
  labels:
    grafana_dashboard: '1'
data:
  homeease-business.json: |
    {
      "title": "HomeEase Business Overview",
      "uid": "homeease-business",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Total Bookings",
          "description": "All-time total bookings from DB (homeease_total_bookings gauge, refreshed every 30s by metricsCollector)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(homeease_total_bookings)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 2,
          "title": "Completed Bookings",
          "description": "Current count of bookings in Completed status (DB gauge)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
