          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(homeease_total_services)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 11,
          "title": "Emergency Requests",
          "description": "Total emergency requests ever created (DB gauge)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
