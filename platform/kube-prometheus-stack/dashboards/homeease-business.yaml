          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(homeease_available_professionals)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 10,
          "title": "Total Services",
          "description": "Service catalog size (DB gauge)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
