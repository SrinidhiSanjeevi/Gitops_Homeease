          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
