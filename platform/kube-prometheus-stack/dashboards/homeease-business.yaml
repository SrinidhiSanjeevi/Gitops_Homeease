        {
          "id": 13,
          "title": "Booking Confirmation Rate (all bookings)",
          "description": "% of booking requests that were confirmed in the last 15 minutes",
          "type": "gauge",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 40
                  },
                  {
                    "color": "green",
                    "value": 70
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (max(homeease_bookings_by_status{status=\"Confirmed\"}) + max(homeease_bookings_by_status{status=\"Completed\"})) / (max(homeease_total_bookings) > 0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 14,
          "title": "Booking Cancellation Rate (all bookings)",
          "description": "% of booking requests that were cancelled in the last 15 minutes",
          "type": "gauge",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 20
                  },
                  {
                    "color": "red",
                    "value": 40
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * max(homeease_bookings_by_status{status=\"Cancelled\"}) / (max(homeease_total_bookings) > 0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 15,
          "title": "Booking Completion Rate (confirmed bookings)",
          "description": "% of confirmed bookings that reached Completed in the last 15 minutes",
          "type": "gauge",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * max(homeease_bookings_by_status{status=\"Completed\"}) / ((max(homeease_bookings_by_status{status=\"Completed\"}) + max(homeease_bookings_by_status{status=\"Confirmed\"})) > 0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 16,
          "title": "Professional Assignment Latency (p95, live)",
          "description": "95th percentile time from booking creation to a professional being assigned, over the selected time range. Empty when no assignment happened in the range.",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 21,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "noValue": "No assignments in range"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum(increase(homeease_professional_assignment_time_seconds_bucket[$__range])) by (le))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 17,
          "title": "Booking Completion Latency (p95, live)",
