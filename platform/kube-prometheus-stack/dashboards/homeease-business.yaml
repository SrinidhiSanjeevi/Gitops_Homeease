              },
              "expr": "max(homeease_bookings_by_status{status=\"Cancelled\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 5,
          "title": "Active Bookings",
          "description": "In-flight bookings (Created+Assigned+Confirmed) \u2014 in-process gauge per pod",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (status) (homeease_bookings_by_status{status=~\"Created|Assigned|Confirmed\"}))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 6,
          "title": "Total Revenue (\u20b9)",
          "description": "Money actually collected: totalPrice of Paid and cash-collected bookings plus late-cancellation fees (DB gauge, backend metricsCollector)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyINR",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "gold"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gold",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(homeease_total_revenue)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 7,
          "title": "Total Users",
          "description": "Registered customer accounts (DB gauge)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
