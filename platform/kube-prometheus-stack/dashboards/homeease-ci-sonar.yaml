apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-ci-sonar-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-ci-sonar.json: |
    {
      "title": "HomeEase - CI Security (SonarCloud)",
      "uid": "homeease-ci-sonar",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": "Loki",
            "query": {
              "label": "service",
              "stream": "{app=\"homeease-ci\", source=\"sonarcloud\"}",
              "type": 1
            },
            "includeAll": true,
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Gate failures (range)",
          "type": "stat",
          "datasource": "Loki",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Loki",
              "expr": "sum(count_over_time({app=\"homeease-ci\", source=\"sonarcloud\"} | json | gate=\"ERROR\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Gate passes (range)",
          "type": "stat",
          "datasource": "Loki",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Loki",
              "expr": "sum(count_over_time({app=\"homeease-ci\", source=\"sonarcloud\"} | json | gate=\"OK\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Blockers by service (latest per run)",
          "type": "timeseries",
          "datasource": "Loki",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Loki",
              "expr": "max by (service) (max_over_time({app=\"homeease-ci\", source=\"sonarcloud\", service=~\"$service\"} | json | unwrap counts_blocker [1h]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "High + Medium by service",
          "type": "timeseries",
          "datasource": "Loki",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Loki",
              "expr": "max by (service) (max_over_time({app=\"homeease-ci\", source=\"sonarcloud\", service=~\"$service\"} | json | unwrap counts_high [1h]))",
              "legendFormat": "{{service}} high"
            },
            {
              "refId": "B",
              "datasource": "Loki",
              "expr": "max by (service) (max_over_time({app=\"homeease-ci\", source=\"sonarcloud\", service=~\"$service\"} | json | unwrap counts_medium [1h]))",
              "legendFormat": "{{service}} medium"
            }
          ]
        },
        {
          "id": 5,
          "title": "Latest Sonar reports (raw JSON)",
          "type": "logs",
          "datasource": "Loki",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Loki",
              "expr": "{app=\"homeease-ci\", source=\"sonarcloud\", service=~\"$service\"}"
            }
          ],
          "options": {
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
