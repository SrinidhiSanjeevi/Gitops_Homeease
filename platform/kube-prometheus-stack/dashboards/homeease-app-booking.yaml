# Grafana dashboard provisioning via the chart's sidecar — see
# grafana.sidecar.dashboards in ../values.yaml.
#
# Redesigned as a compact, all-Stat "at a glance" overview (no time-series
# graphs) for demo/presentation use. Same underlying PromQL as the
# previous version where the panel still exists here; HTTP error/latency
# detail moved to homeease-http.yaml, booking-rate detail moved to
# homeease-business.yaml, to avoid duplicate panels across dashboards.
#
# Metric names copy-checked against app_Homeease/backend/metrics.js —
# nothing invented. "Payment Service Health" reads "No data" until
# payment-service is actually deployed (its ServiceMonitor exists, but
# there's no pod yet) — that's expected, not a dashboard bug.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-app-booking-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-app-booking.json: |
    {
      "title": "HomeEase - Application & Booking",
      "uid": "homeease-app-booking",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "Total HTTP Requests", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"backend\"}[5m]))" }]
        },
        {
          "id": 4, "title": "Active Bookings", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(serviceexpress_active_bookings)" }]
        },
        {
          "id": 6, "title": "Confirmed Bookings (rate)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(serviceexpress_bookings_confirmed_total[5m]))" }]
        },
        {
          "id": 7, "title": "Cancelled Bookings (rate)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(serviceexpress_bookings_cancelled_total[5m]))" }]
        },
        {
          "id": 8, "title": "Completed Bookings (rate)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(serviceexpress_bookings_completed_total[5m]))" }]
        },
        {
          "id": 11, "title": "Running Pods", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"homeease-dev\", phase=\"Running\"})" }]
        },
        {
          "id": 12, "title": "Available Replicas", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(kube_deployment_status_replicas_available{namespace=\"homeease-dev\"})" }]
        },
        {
          "id": 10, "title": "Backend Health (Target UP)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "up{job=\"backend\"}" }]
        },
        {
          "id": 13, "title": "Payment Service Health", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "up{job=\"payment-service\"}" }]
        }
      ]
    }
