apiVersion: v1
kind: ConfigMap
metadata:
  name: homeease-app-booking-dashboard
  labels:
    grafana_dashboard: "1"
data:
  homeease-app-booking.json: |
    {
      "title": "HomeEase - Application & Booking",
      "uid": "homeease-app-booking",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "HTTP Request Rate (backend)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"backend\"}[5m]))" }]
        },
        {
          "id": 4, "title": "Active Bookings", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(max by (status) (serviceexpress_bookings_by_status{status=~\"Created|Assigned|Confirmed\"}))" }]
        },
        {
          "id": 6, "title": "Confirmed Bookings (in time range)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(serviceexpress_bookings_confirmed_total[$__range])))" }]
        },
        {
          "id": 7, "title": "Cancelled Bookings (in time range)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(serviceexpress_bookings_cancelled_total[$__range])))" }]
        },
        {
          "id": 8, "title": "Completed Bookings (in time range)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 5 },
          "fieldConfig": { "defaults": { "decimals": 0, "unit": "short" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "round(sum(increase(serviceexpress_bookings_completed_total[$__range])))" }]
        },
        {
          "id": 11, "title": "Running Pods", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 5 },
          "fieldConfig": {
            "defaults": { "decimals": 0,
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(kube_pod_status_phase{namespace=\"homeease-dev\", phase=\"Running\"})" }]
        },
        {
          "id": 12, "title": "Available Replicas", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": { "decimals": 0,
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "sum(kube_deployment_status_replicas_available{namespace=\"homeease-dev\"})" }]
        },
        {
          "id": 10, "title": "Backend Health (Target UP)", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "min(up{job=\"backend\"})" }]
        },
        {
          "id": 13, "title": "Payment Service Health", "type": "stat",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "min(up{job=\"payment-service\"})" }]
        }
      ]
    }
