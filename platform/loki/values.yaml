# Loki — SingleBinary mode, filesystem-backed (not object-storage-backed).

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Replication factor 1 — single-binary mode has only one replica.
  commonConfig:
    replication_factor: 1

  limits_config:
    retention_period: 720h # 30 days
    reject_old_samples: true

  # Enables the compactor, which enforces retention_period above.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m # was 100m — DEV is one 2-vCPU node (Free Trial 4-vCPU cap)
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

# SingleBinary mode doesn't use these — zeroed explicitly.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Extra self-check pods this cluster doesn't need.
test:
  enabled: false
lokiCanary:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# Memcached caches — disabled for singleBinary filesystem-backed mode on a 2-node dev cluster.
# By default chart 7.3.0 allocates 8192MB (9830Mi) for chunks cache which cannot schedule on 8GiB nodes.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

