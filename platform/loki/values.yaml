# ============================================================
# Loki — SingleBinary mode, filesystem-backed.
#
# The chart's default (`deploymentMode: SimpleScalable`) runs
# separate read/write/backend StatefulSets, each replicated 3x by
# default — 9+ pods for a log store on a 1-3 node dev cluster. Not
# appropriate here. SingleBinary mode is one Deployment, one replica.
#
# Filesystem-backed, not object-storage-backed: this means Loki's
# chunks live on a PVC, which does NOT survive a cluster-level
# failure (Azure Disk is zone-locked to whatever node it was attached
# to). That is a real, documented limitation, not an oversight — the
# correct production answer ("logs must survive the incident") is
# Loki writing chunks to Azure Blob Storage via Workload Identity,
# which needs a new storage account + a new federated identity that
# don't exist yet. This file is the "get logs flowing and queryable
# in Grafana" step; object storage is the next hardening step, not
# this one.
# ============================================================

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Default is 3 — correct for the multi-replica SimpleScalable mode,
  # wrong here: with one single-binary replica, requiring 3 copies of
  # every write before it's acknowledged would mean every write fails.
  commonConfig:
    replication_factor: 1

  limits_config:
    retention_period: 720h # 30 days
    reject_old_samples: true

  # Without this, the compactor never runs and chunks accumulate on
  # the PVC forever regardless of retention_period above — this is
  # the actual enforcement mechanism, not the limits_config value by
  # itself.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

# SingleBinary mode doesn't use these — zeroed explicitly so a future
# chart upgrade defaulting them back up doesn't silently reintroduce
# 9 unwanted pods.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# This chart's own test/canary/monitoring self-checks are extra pods
# this cluster doesn't need for the value they add at this scale.
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
