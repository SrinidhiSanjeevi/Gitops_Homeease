# Child Application #2: cluster-wide platform components (ingress,
# cert-manager, kube-prometheus-stack, Loki — see platform/README.md).
# Deliberately in the DEFAULT project, not the `homeease` project —
# platform components are cluster-scoped by nature (CRDs, webhooks,
# ClusterRoles) and the homeease AppProject's whole point is to deny
# cluster-scoped resources to the four app Applications. Mixing the
# two would mean widening homeease's project just to let platform
# components through.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeease-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/gitops_homeease.git
    targetRevision: main
    path: platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
