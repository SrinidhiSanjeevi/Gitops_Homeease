# Child Application #3: the ApplicationSet resource itself (see
# applicationsets/homeease-appset.yaml, added in the ApplicationSet
# task). This Application's only job is to keep that ONE
# ApplicationSet object in sync — the ApplicationSet controller then
# generates the per-service, per-environment Application objects.
# Two levels of indirection (root-app -> this -> the ApplicationSet
# -> N generated Applications) sounds like a lot until you remember
# each level exists to answer one question:
#   root-app:        "what does this cluster run, at all?"
#   this Application: "keep the fan-out RULE in sync"
#   the ApplicationSet: "given that rule, what should exist right now?"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeease-applicationsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/gitops_homeease.git
    targetRevision: main
    path: applicationsets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
