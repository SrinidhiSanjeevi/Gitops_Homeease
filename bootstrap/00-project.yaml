# Child Application #1 of the root app-of-apps: syncs the AppProject
# definition from projects/. Kept as its own Application (rather than
# folding the AppProject into root-app's own directory scan) so the
# project boundary can be reviewed/synced independently of everything
# that depends on it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeease-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrinidhiSanjeevi/gitops_homeease.git
    targetRevision: main
    path: projects
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
