# Same multi-source pattern as platform/kube-prometheus-stack —
# see that Application's comment for why.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "7.3.0"
      helm:
        valueFiles:
          - $values/platform/loki/values.yaml
    - repoURL: https://github.com/SrinidhiSanjeevi/gitops_homeease.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
