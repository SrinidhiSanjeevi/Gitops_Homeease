# ============================================================
# AppProject — scopes what Applications under this project are
# allowed to do, independent of any single Application's own spec.
# Without this, every Application uses the `default` AppProject,
# which permits ANY source repo and ANY destination namespace/cluster
# — effectively no boundary at all.
#
# This is applied once, manually or via the bootstrap root-app,
# before any ApplicationSet references `project: homeease`.
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homeease
  namespace: argocd
spec:
  description: HomeEase application services (frontend, backend, admin-backend, payment-service)

  # Only this repo may be a source. An Application in this project
  # pointing at a different Git URL is rejected at admission, not
  # just discouraged by convention.
  sourceRepos:
    - "https://github.com/SrinidhiSanjeevi/gitops_homeease.git"

  # Only the AKS cluster this project is meant for, and only into
  # homeease-* namespaces. A typo'd destination namespace (e.g.
  # accidentally targeting kube-system) is rejected, not applied.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "homeease-dev"
    - server: https://kubernetes.default.svc
      namespace: "homeease-staging"
    - server: https://kubernetes.default.svc
      namespace: "homeease-prod"

  # Cluster-scoped resources are the highest blast-radius risk if a
  # compromised or mis-templated Application tries to create them.
  # HomeEase's services never need to — deny everything cluster-
  # scoped by leaving this list empty rather than allowing "*".
  clusterResourceWhitelist: []

  # Namespace-scoped kinds the four services legitimately need.
  # Notably absent: ResourceQuota/LimitRange (namespace-owner concern,
  # managed by platform/, not by an app team's Application) and
  # anything RBAC-shaped (Role/RoleBinding) — a service Application
  # should never be able to grant itself permissions.
  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "policy"
      kind: PodDisruptionBudget
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "secrets-store.csi.x-k8s.io"
      kind: SecretProviderClass
    - group: "monitoring.coreos.com"
      kind: ServiceMonitor

  roles:
    - name: readonly
      description: Read-only access for viewing sync status and history
      policies:
        - p, proj:homeease:readonly, applications, get, homeease/*, allow
      groups: []
