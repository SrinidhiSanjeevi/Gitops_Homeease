# ============================================================
# THE MATRIX GENERATOR — service × environment, crossed explicitly.
#
# This does NOT scan apps/ for values files and "figure out" what
# exists. It crosses two flat lists you define below (services,
# environments) and feeds each combination into ONE Application
# template. Nothing here is inferred — every field the template uses
# (.service, .environment, .namespace) is a literal key you can see
# in the generator lists directly above it.
#
#   4 services × 1 environment (today)  = 4 generated Applications
#   4 services × 3 environments (later) = 12 generated Applications
#
# ONE ApplicationSet PER SYNC POLICY, not one ApplicationSet with a
# conditional inside it. `goTemplate: true` mode templates individual
# STRING fields (path, namespace, name, label values) — it does not
# reliably let you conditionally omit a whole structured field like
# `syncPolicy.automated` based on a generator value. (An empty
# `automated: {}` is not "no automation" — it can still mean
# "sync automatically, with prune/selfHeal defaulted to false," which
# is a different thing from the field being absent entirely.) Rather
# than depend on that subtlety, dev gets its own ApplicationSet with
# a hardcoded automated block; when Task 9 adds staging/prod, they
# get a second ApplicationSet with no automated block at all — same
# Matrix-generator mechanism, same template shape, one static
# decision per file instead of one conditional per generated entry.
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homeease-services-dev
  namespace: argocd
spec:
  # goTemplateOptions: missingkey=error — a typo'd field name (e.g.
  # `.evironment`) fails the render immediately instead of silently
  # emitting the literal string "<no value>" into a manifest that
  # then gets applied.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - service: frontend
                - service: backend
                - service: admin-backend
                - service: payment-service

          # A one-element list today. Task 9 does NOT touch this
          # ApplicationSet to add staging/prod — it adds a SECOND
          # ApplicationSet (homeease-services-promoted, or similar)
          # with its own one-or-two-element environment list and no
          # automated sync block. This file stays dev-only forever.
          - list:
              elements:
                - environment: dev
                  namespace: homeease-dev

  template:
    metadata:
      name: "{{.service}}-{{.environment}}"
      labels:
        homeease.io/service: "{{.service}}"
        homeease.io/environment: "{{.environment}}"
    spec:
      project: homeease
      source:
        repoURL: https://github.com/SrinidhiSanjeevi/gitops_homeease.git
        targetRevision: main
        path: "apps/{{.service}}"
        helm:
          # base values.yaml first, then the environment overlay —
          # order matters, the second file wins on any key collision.
          # apps/<service>/Chart.yaml depends on charts/common via a
          # same-repo relative file:// path; Argo CD's repo-server
          # resolves that at template time because both paths are in
          # the one cloned repo — no chart registry involved, nothing
          # extra to configure.
          valueFiles:
            - values.yaml
            - "values-{{.environment}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        # Static and unconditional in THIS file — every Application
        # this ApplicationSet generates is dev, and dev always auto-
        # syncs. Self-heal means a manual `kubectl edit` on a dev
        # resource gets reverted on the next reconcile loop —
        # deliberate: dev's only source of truth is Git, same as
        # every other environment, it just doesn't need a human to
        # press the button.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
