# ============================================================
# REFERENCE ONLY — Helm never loads this file at render time.
#
# A `type: library` chart cannot be installed on its own, and when
# its templates are pulled in via `{{ include "common.xxx" . }}`
# from a parent chart's own template, the `.` context passed is the
# PARENT's root — so `.Values` resolves against the parent's
# coalesced values, never this file. (Confirmed directly: `helm
# lint` on a consuming chart that didn't repeat these keys failed
# with a nil-pointer error on `.Values.serviceAccount.create` even
# though it's set right here.)
#
# So every apps/<service>/values.yaml below is fully self-contained
# — it repeats this whole schema, then overrides the handful of keys
# that are actually service-specific (image.repository, ports,
# health-check paths). What still lives in exactly ONE place is the
# thing that's actually expensive to keep consistent across four
# services: the template LOGIC in charts/common/templates/*.tpl.
# Copying a values block four times is cheap and explicit; copying
# template logic four times is how the four services quietly drift.
#
# This file exists so a reviewer has one place to see "what does
# common actually default to" without diffing four apps/*/values.yaml
# files against each other.
# ============================================================

nameOverride: ""
fullnameOverride: ""
environment: dev

image:
  repository: ""   # set per service — e.g. acrhomeeasedev.azurecr.io/homeease/backend
  tag: ""          # set per environment values file. Never "latest", never blank.
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  labels: {}
  annotations: {}

# Azure AD Workload Identity — off by default. Turn on per service
# that actually needs to reach Key Vault or another Azure resource
# directly (see terraform/azure/modules/workload-identity for the
# federated credential this clientId must match).
workloadIdentity:
  enabled: false
  clientId: ""

podLabels: {}
podAnnotations: {}

# Hardened by default — see §4 of the security checklist this chart
# implements. A service that genuinely needs to relax one of these
# (e.g. a legacy dependency that writes outside /tmp) overrides it
# explicitly in its own values file, which makes the exception
# visible in a diff instead of invisible in a shared default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

# Off by default deliberately: a single-replica dev deployment with
# minAvailable: 1 blocks 100% of voluntary node drains/evictions —
# the PDB would make maintenance impossible, not safer. Turn this on
# in values-staging/values-prod once replicaCount >= 2.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Unset by default. A Mongo-backed service that's slow to warm up
# gets one added in its own values file rather than every service
# paying for a startup grace period it doesn't need.
startupProbe: {}

env: []
envFrom: []

volumes: []
volumeMounts: []
extraVolumes: []
extraVolumeMounts: []

secretProviderClass:
  enabled: false
  keyvaultName: ""
  tenantId: ""
  objects: []       # [{objectName, objectType, objectVersion}]
  secretObjects: [] # optional: also sync into a native k8s Secret

# Default-deny is only meaningful once policyTypes actually includes
# the direction you want enforced — an empty ingress/egress list with
# the type NOT listed here means "unrestricted", not "denied". Set
# explicitly per service.
networkPolicy:
  enabled: false
  policyTypes: []
  ingress: []
  egress: []

priorityClassName: ""

terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
