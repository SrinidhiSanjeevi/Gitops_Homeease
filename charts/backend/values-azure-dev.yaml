# Direct Helm equivalent of apps/backend/overlays/azure/dev/{kustomization.yaml,secretproviderclass.yaml}.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/backend
  tag: 93917ef237a9
ingress:
  host: api.20-207-75-39.nip.io
workloadIdentity:
  enabled: true
  # terraform output workload_identity_app_client_id (id-homeease-app-dev)
  clientId: "9850ab0c-1f03-4a65-8f77-c4ff988a1af4"
keyVault:
  name: kv-homeease-dev-hs02 # terraform output key_vault_name
  tenantId: "268c9f5b-bb6f-44e8-b872-ea399b1998c2" # az account show --query tenantId
secretProviderClass:
  enabled: true
extraLabels:
  homeease.io/environment: dev
  homeease.io/cloud: azure
env:
  azureStorageAccountName: "sthomeeaseimgayhiue"
# Free Trial subscription: hard 4-vCPU cap, so only the CPU request is lowered here.
resources:
  requests:
    cpu: 50m
# No headroom for a RollingUpdate surge pod under the 4-vCPU cap, so Recreate avoids stuck rollouts.
updateStrategy:
  type: Recreate
