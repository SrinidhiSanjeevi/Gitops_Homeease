image:
  repository: homeease/backend
  tag: placeholder
  pullPolicy: IfNotPresent

service:
  port: 5000
  targetPortName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

ingress:
  enabled: true
  host: api.dev.example.com
  paths:
    - /api
    - /health
  tlsSecretName: backend-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true

env:
  # Free-form extra environment variables (name: value), e.g. TRUST_PROXY_HOPS.
  extra: {}
  paymentServiceUrl: http://payment-service:5002
  notificationServiceUrl: http://notification-service:5003
  azureStorageAccountName: ""
  # Per-IP request limits per 15 minutes (backend defaults apply when empty). Visitors behind one
  # wifi/NAT share an IP, so demo environments raise these.
  rateLimits: {}

workloadIdentity:
  enabled: false
  clientId: ""

# AWS (EKS): IAM Roles for Service Accounts. The Azure equivalent is workloadIdentity above.
irsa:
  enabled: false
  roleArn: ""

keyVault:
  name: ""
  tenantId: ""

secretProviderClass:
  enabled: false
  # azure (Key Vault, default) or aws (Secrets Manager). For aws each object uses `awsSecret`
  # (the Secrets Manager name) instead of `keyVaultObject`, and `region` is required.
  provider: azure
  region: ""
  secretName: backend-secrets
  objects:
    - keyVaultObject: booking-mongo-uri
      envKey: MONGO_URI
    - keyVaultObject: jwt-secret
      envKey: JWT_SECRET
    - keyVaultObject: internal-service-token
      envKey: INTERNAL_SERVICE_TOKEN

extraLabels: {}

serviceMonitor:
  enabled: true
