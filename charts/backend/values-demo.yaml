# Standalone demo values — proves this chart installs independently of
# the live ArgoCD-managed homeease-dev release, in its own namespace.
# Identical to values-azure-dev.yaml except for a unique Ingress
# hostname (avoids the ingress-nginx admission-webhook host+path
# uniqueness conflict with the live Ingress).
#
# NOTE: workloadIdentity/secretProviderClass are left enabled, with the
# SAME real clientId, to preserve the chart's actual functionality
# rather than silently stripping it for the demo. In practice this means
# the CSI secret mount will fail here: the Azure AD federated credential
# for this identity is scoped to the exact subject
# system:serviceaccount:homeease-dev:backend, not
# system:serviceaccount:homeease-helm-demo:backend — so this pod will
# not reach Ready in the demo namespace. That's an Azure IAM federation
# boundary, not a chart or Helm defect; it's expected and reported as
# such rather than hidden.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/backend
  tag: 5d4e71d3fcd2

ingress:
  host: api-demo.20-207-75-39.nip.io

workloadIdentity:
  enabled: true
  clientId: "9850ab0c-1f03-4a65-8f77-c4ff988a1af4"

keyVault:
  name: kv-homeease-dev-hs02
  tenantId: "268c9f5b-bb6f-44e8-b872-ea399b1998c2"

secretProviderClass:
  enabled: true

extraLabels:
  homeease.io/environment: demo
  homeease.io/cloud: azure
