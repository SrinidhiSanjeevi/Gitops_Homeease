# Azure STAGING overrides — shares dev's cluster, MongoDB, and Key Vault secrets (cost-constrained trial subscription).
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/backend
  tag: 93917ef237a9
ingress:
  host: api-staging.20-207-75-39.nip.io
workloadIdentity:
  enabled: true
  # Same identity as values-azure-dev.yaml, federated to both dev and staging ServiceAccounts.
  clientId: "9850ab0c-1f03-4a65-8f77-c4ff988a1af4"
