apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/use: "true"
    {{- end }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    # Tells the identity federation which Azure AD app this ServiceAccount
    # maps to. backend and admin-backend share one Azure AD workload
    # identity (id-homeease-app-dev), which has its own federated
    # credential per ServiceAccount.
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
