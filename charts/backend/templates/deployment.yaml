apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  # No replicas field here on purpose — the HPA (templates/hpa.yaml) owns
  # spec.replicas. See templates/hpa.yaml / values.yaml for why.
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        # Required on the pod itself for the workload identity webhook to inject the token volume.
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "backend.selectorLabels" . | nindent 14 }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Gives a new pod up to 2 minutes to warm up before liveness/readiness probes count failures.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Required — without it paymentClient.js falls back to a local-dev default and payment calls fail.
          env:
            - name: PAYMENT_SERVICE_URL
              value: {{ .Values.env.paymentServiceUrl }}
            # Required — same as PAYMENT_SERVICE_URL, for notificationClient.js.
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.env.notificationServiceUrl }}
            # Reported by /health/live so the deploy pipeline can confirm which image is serving.
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- if .Values.env.azureStorageAccountName }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ .Values.env.azureStorageAccountName | quote }}
            {{- end }}
          {{- if .Values.secretProviderClass.enabled }}
          # Populated by the Secrets Store CSI driver's secretObjects sync (templates/secretproviderclass.yaml).
          envFrom:
            - secretRef:
                name: {{ .Values.secretProviderClass.secretName }}
          {{- end }}
          volumeMounts:
            # readOnlyRootFilesystem is on; Node/npm still writes scratch files to /tmp unconditionally.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secretProviderClass.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secretProviderClass.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            # Must match metadata.name of the SecretProviderClass
            # (templates/secretproviderclass.yaml).
            volumeAttributes:
              secretProviderClass: backend
        {{- end }}
