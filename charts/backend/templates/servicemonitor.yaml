# Tells kube-prometheus-stack's Prometheus to scrape this service's
# /metrics endpoint. Picked up automatically — the platform's Prometheus
# watches every ServiceMonitor in every namespace (see
# platform/kube-prometheus-stack/values.yaml, out of scope for this chart).
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    # The CRD comes from the monitoring app; on a fresh cluster this app can
    # sync first. Skip the dry-run instead of failing the whole sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
