{{- if .Values.secretProviderClass.enabled }}
# Azure Key Vault provider for the Secrets Store CSI driver. The driver +
# azure provider ship as the AKS-managed key_vault_secrets_provider addon
# — nothing extra needs installing on the cluster for this to work.
# Requires the workload identity annotation on the backend ServiceAccount
# (templates/serviceaccount.yaml) so the driver can authenticate to Key
# Vault as this service's own identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  # No app.kubernetes.io/name or part-of here — the existing Kustomize
  # overlay's SecretProviderClass never declared metadata.labels at all;
  # only the overlay's own homeease.io/cloud + homeease.io/environment
  # pair reaches it (via the azure-dev overlay's labels transformer),
  # never the base file's app.kubernetes.io labels. Matching that exactly.
  {{- with .Values.extraLabels }}
  labels:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  provider: azure
  parameters:
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretProviderClass.objects }}
        - |
          objectName: {{ .keyVaultObject }}
          objectType: secret
        {{- end }}
  # Also syncs into a native k8s Secret, so backend's required env vars
  # (MONGO_URI, JWT_SECRET) plus the email-sending feature's vars can be
  # wired via envFrom (see templates/deployment.yaml) without the app
  # knowing about the CSI mount.
  secretObjects:
    - secretName: {{ .Values.secretProviderClass.secretName }}
      type: Opaque
      data:
        {{- range .Values.secretProviderClass.objects }}
        - objectName: {{ .keyVaultObject }}
          key: {{ .envKey }}
        {{- end }}
{{- end }}
