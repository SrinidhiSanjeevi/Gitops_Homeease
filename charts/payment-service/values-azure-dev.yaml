# Direct Helm equivalent of apps/payment-service/overlays/azure/dev/{kustomization.yaml,secretproviderclass.yaml}.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/payment-service
  tag: a5889f33f942
workloadIdentity:
  enabled: true
  # terraform output workload_identity_payment_client_id (id-homeease-payment-dev)
  clientId: "906080fd-636f-4c49-ab58-f7da81381014"
keyVault:
  name: kv-homeease-dev-hs02
  tenantId: "268c9f5b-bb6f-44e8-b872-ea399b1998c2"
secretProviderClass:
  enabled: true
extraLabels:
  homeease.io/environment: dev
  homeease.io/cloud: azure
# Free Trial subscription: hard 4-vCPU cap, so DEV is one 2-vCPU node.
# Only the CPU *request* is lowered so the whole stack schedules; limits
# come from values.yaml unchanged, so the pod can still burst.
resources:
  requests:
    cpu: 50m
