image:
  repository: homeease/payment-service
  tag: placeholder
  pullPolicy: IfNotPresent

service:
  port: 5002
  targetPortName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hpa:
  minReplicas: 1
  maxReplicas: 2
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

env:
  # Free-form extra environment variables (name: value), e.g. TRUST_PROXY_HOPS.
  extra: {}
  bookingServiceUrl: http://backend:5000

networkPolicy:
  enabled: true

workloadIdentity:
  enabled: false
  clientId: ""

# AWS (EKS): IAM Roles for Service Accounts. The Azure equivalent is workloadIdentity above.
irsa:
  enabled: false
  roleArn: ""

keyVault:
  name: ""
  tenantId: ""

secretProviderClass:
  enabled: false
  # azure (Key Vault, default) or aws (Secrets Manager). For aws each object uses `awsSecret`
  # (the Secrets Manager name) instead of `keyVaultObject`, and `region` is required.
  provider: azure
  region: ""
  secretName: payment-service-razorpay
  objects:
    - keyVaultObject: razorpay-key-id
      envKey: RAZORPAY_KEY_ID
    - keyVaultObject: razorpay-key-secret
      envKey: RAZORPAY_KEY_SECRET
    - keyVaultObject: payment-mongo-uri
      envKey: MONGO_URI
    - keyVaultObject: internal-service-token
      envKey: INTERNAL_SERVICE_TOKEN

extraLabels: {}

serviceMonitor:
  enabled: true
