# Its own ServiceAccount, not a shared one — Azure Workload Identity
# federates on (namespace, service-account-name), so a shared SA across
# services would mean every service inherits whatever secret access this
# one carries.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/use: "true"
    {{- end }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
