apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "payment-service.selectorLabels" . | nindent 4 }}
  ports:
    # Matches the container's port (5002) — backend's PAYMENT_SERVICE_URL
    # (charts/backend/templates/deployment.yaml) depends on this.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPortName }}
      protocol: TCP
