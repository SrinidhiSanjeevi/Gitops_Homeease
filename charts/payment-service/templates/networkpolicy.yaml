{{- if .Values.networkPolicy.enabled }}
# Default-deny, explicit-allow — the only caller of payment-service is backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 5002
    # Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5002
  # No egress block: egress stays unrestricted (needs Razorpay's API and booking-service in-cluster).
{{- end }}
