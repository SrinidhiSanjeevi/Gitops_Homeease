{{- if .Values.networkPolicy.enabled }}
# Default-deny, explicit-allow — tighter than the other three services on
# purpose. The ONLY caller of payment-service anywhere in the system is
# backend. Not ingress-nginx, not admin-backend, not frontend, not the
# internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 5002
    # Prometheus (kube-prometheus-stack, namespace "monitoring") scraping
    # /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5002
  # No egress block: egress stays unrestricted (payment-service needs to
  # reach Razorpay's API on the internet).
{{- end }}
