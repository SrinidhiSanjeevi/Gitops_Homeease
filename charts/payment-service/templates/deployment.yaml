# payment-service gets more here than the other three services — it's
# the one place a mistake has a real (simulated) financial consequence,
# so its blast radius is deliberately smaller: no public Ingress, secrets
# pulled straight from the cloud's own secret store, NetworkPolicy locked
# to "only backend may call this" (see templates/networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  # No replicas field here on purpose — the HPA (templates/hpa.yaml) owns
  # spec.replicas.
  selector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-service.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: payment-service
      # REQUIRED CORRECTNESS SETTING — not configurable, not a values
      # toggle. Kubernetes auto-injects a PAYMENT_SERVICE_PORT env var for
      # every Service named "payment-service" in this namespace (legacy
      # Docker-links compatibility, format tcp://<clusterIP>:<port>) —
      # this collides with and silently overrides the app's OWN
      # PAYMENT_SERVICE_PORT read in server.js, so it tries to bind to the
      # literal string "tcp://10.20.x.x:80" instead of 5002 and
      # crash-loops on the startup probe. Disabling service-links avoids
      # the whole class of collision; nothing in this app relies on them.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "payment-service.selectorLabels" . | nindent 14 }}
      containers:
        - name: payment-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5002
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.secretProviderClass.enabled }}
          # Populated by the Secrets Store CSI driver's secretObjects sync
          # (see templates/secretproviderclass.yaml) — the app reads
          # MONGO_URI / RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET from
          # process.env exactly as it already does locally via .env.
          # RAZORPAY_WEBHOOK_SECRET is intentionally not included —
          # webhooks aren't configured yet and validateEnv.js doesn't
          # require it.
          envFrom:
            - secretRef:
                name: {{ .Values.secretProviderClass.secretName }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secretProviderClass.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secretProviderClass.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: payment-service
        {{- end }}
