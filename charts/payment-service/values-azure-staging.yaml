# Azure STAGING overrides — Phase 1: homeease-staging namespace on the
# SAME aks-homeease-dev cluster (cost-constrained trial subscription, no
# second cluster). Staging intentionally shares dev's MongoDB
# databases/Key Vault secrets and workload-identity clientId for now —
# not an oversight; full data isolation is a future improvement once
# cost allows a second Key Vault/DB set. See
# Infrastructure_Homeease terraform/azure/environments/dev/main.tf,
# which federates this SAME identity to the homeease-staging namespace's
# "payment-service" ServiceAccount too.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/payment-service
  tag: fc121325733c
workloadIdentity:
  enabled: true
  # Same identity as values-azure-dev.yaml (terraform output
  # workload_identity_payment_client_id, id-homeease-payment-dev) —
  # federated to BOTH homeease-dev and homeease-staging ServiceAccounts.
  clientId: "906080fd-636f-4c49-ab58-f7da81381014"
keyVault:
  name: kv-homeease-dev-hs02
  tenantId: "268c9f5b-bb6f-44e8-b872-ea399b1998c2"
secretProviderClass:
  enabled: true
extraLabels:
  homeease.io/environment: staging
  homeease.io/cloud: azure
# Free Trial subscription: hard 4-vCPU cap shared with dev/demo on the
# same cluster. Same lowered CPU request as dev.
resources:
  requests:
    cpu: 50m
