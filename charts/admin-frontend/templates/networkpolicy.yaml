{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress, explicit allow only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admin-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "admin-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress-nginx controller talks to admin-frontend directly —
    # nothing else in the cluster needs to.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  # No egress block: egress stays unrestricted for in-cluster proxying to admin-backend.
{{- end }}
