{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admin-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "admin-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.publicService.enabled }}
    # Reached directly through its own public IP (not through the ingress).
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
