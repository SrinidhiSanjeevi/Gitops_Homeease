image:
  repository: homeease/admin-frontend
  tag: placeholder
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPortName: http

# Gives the admin console its own public IP (service type LoadBalancer) so it can be opened by IP address
# where hostnames such as nip.io are blocked. The admin sign-in still protects it. Off by default.
publicService:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

ingress:
  enabled: true
  className: nginx
  host: admin-console.dev.example.com
  tlsSecretName: admin-frontend-tls
  clusterIssuer: letsencrypt-prod
  # false when TLS is terminated in front of the cluster (CloudFront on AWS): no cert-manager, no tls block.
  tlsEnabled: true
  sslRedirect: true
  extraHostlessRule: false

networkPolicy:
  enabled: true

extraLabels: {}
