image:
  repository: acrhomeeasedev01.azurecr.io/homeease/admin-frontend
  tag: a2822dbb135f
# Reached through its own ingress controller (platform/ingress-nginx-admin) at a free Azure DNS name,
# so the old plain-HTTP public IP is no longer needed.
publicService:
  enabled: false
ingress:
  className: nginx-admin
  clusterIssuer: letsencrypt-admin
  host: homeease-admin.centralindia.cloudapp.azure.com
  sslRedirect: true
  extraHostlessRule: false
extraLabels:
  homeease.io/environment: dev
  homeease.io/cloud: azure
resources:
  requests:
    cpu: 25m
