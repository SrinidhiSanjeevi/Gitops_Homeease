# Azure dev overrides — same pattern as charts/frontend/values-azure-dev.yaml.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/admin-frontend
  tag: a5889f33f942
ingress:
  host: admin-console.20-207-75-39.nip.io
  sslRedirect: false
  extraHostlessRule: false
extraLabels:
  homeease.io/environment: dev
  homeease.io/cloud: azure
# Free Trial subscription: hard 4-vCPU cap, so DEV is one 2-vCPU node.
# Only the CPU *request* is lowered so the whole stack schedules; limits
# come from values.yaml unchanged, so the pod can still burst.
resources:
  requests:
    cpu: 25m
