{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    # No-op until platform/cert-manager is actually installed (still a
    # placeholder per platform/README.md) — harmless to set now.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- if not .Values.ingress.sslRedirect }}
    # Serves plain HTTP; no valid TLS cert for this address.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    {{- if .Values.ingress.extraHostlessRule }}
    # Host-less catch-all for requests with no matching Host header.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    {{- end }}
{{- end }}
