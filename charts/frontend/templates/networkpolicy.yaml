{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress, explicit allow only. Only enforced if the
# cluster's CNI implements NetworkPolicy (AKS: Azure NPM/Calico, turned
# on at cluster creation).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress-nginx controller talks to frontend directly —
    # nothing else in the cluster needs to.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  # No egress block: frontend calls backend's public API through the same
  # ingress path a browser would, so egress stays unrestricted.
{{- end }}
