# Cloud/environment-neutral defaults. Azure-dev-specific values (image
# tag, ingress host, extra labels) live in values-azure-dev.yaml — see
# that file for the direct equivalent of apps/frontend/overlays/azure/dev.

image:
  repository: homeease/frontend
  tag: placeholder
  pullPolicy: IfNotPresent

# No top-level `replicas` value on purpose, and none of the templates in
# this chart read one for spec.replicas — the HPA owns replica count.
# See templates/deployment.yaml.

service:
  port: 80
  targetPortName: http

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  # maxUnavailable (not minAvailable): works even at 1 running replica —
  # minAvailable: 1 with a single replica would block 100% of voluntary
  # node drains/evictions instead of making them safer.
  maxUnavailable: 1

ingress:
  enabled: true
  host: app.dev.example.com
  tlsSecretName: frontend-tls
  clusterIssuer: letsencrypt-prod
  # ssl-redirect true is the ingress-nginx default; azure-dev turns this
  # off for the IP-based presentation URL (see values-azure-dev.yaml).
  sslRedirect: true
  # When true, adds a second, host-less rule to the same Ingress object
  # so requests with no matching Host header (e.g. a bare public IP)
  # also reach frontend, without touching the host-specific rule above
  # or any other service's Ingress. Off by default; azure-dev turns it on.
  extraHostlessRule: false

networkPolicy:
  enabled: true

# Merged into metadata.labels and pod-template labels only — never into
# any selector field (Deployment.spec.selector, Service.spec.selector,
# NetworkPolicy.spec.podSelector, HPA.scaleTargetRef). See
# templates/_helpers.tpl: frontend.selectorLabels vs frontend.labels.
extraLabels: {}
