# Cloud/environment-neutral defaults; per-env overrides live in values-azure-*.yaml.

image:
  repository: homeease/frontend
  tag: placeholder
  pullPolicy: IfNotPresent

# No top-level `replicas` value: the HPA owns replica count.

service:
  port: 80
  targetPortName: http

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  # maxUnavailable (not minAvailable): still works at a single replica.
  maxUnavailable: 1

ingress:
  enabled: true
  host: home.dev.example.com
  tlsSecretName: frontend-tls
  clusterIssuer: letsencrypt-prod
  # ssl-redirect true is the ingress-nginx default; azure-dev turns this
  # off for the IP-based presentation URL (see values-azure-dev.yaml).
  sslRedirect: true
  # Adds a second, host-less rule so requests with no matching Host header still reach frontend.
  extraHostlessRule: false

networkPolicy:
  enabled: true

# Merged into labels only, never into selector fields.
extraLabels: {}
