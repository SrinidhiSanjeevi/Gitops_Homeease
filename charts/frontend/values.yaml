image:
  repository: homeease/frontend
  tag: placeholder
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPortName: http

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

ingress:
  enabled: true
  host: home.dev.example.com
  tlsSecretName: frontend-tls
  clusterIssuer: letsencrypt-prod
  # false when TLS is terminated in front of the cluster (CloudFront on AWS): no cert-manager, no tls block.
  tlsEnabled: true
  sslRedirect: true
  extraHostlessRule: false

networkPolicy:
  enabled: true

extraLabels: {}
