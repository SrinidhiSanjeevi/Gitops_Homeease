# Cloud/environment-neutral defaults. Azure-dev-specific values live in
# values-azure-dev.yaml.

image:
  repository: homeease/admin-backend
  tag: placeholder
  pullPolicy: IfNotPresent

# No top-level `replicas` value on purpose — the HPA owns replica count.

service:
  port: 5001
  targetPortName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

ingress:
  enabled: true
  host: admin.dev.example.com
  # Only the API and health routes are public. /metrics (business counts,
  # revenue) stays cluster-internal — Prometheus scrapes it via the Service.
  paths:
    - /api
    - /health
  tlsSecretName: admin-backend-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true

# See charts/backend/values.yaml for the full explanation of this
# section — same shared Azure AD workload identity as backend
# (id-homeease-app-dev), disabled by default so this chart isn't
# Azure-specific.
workloadIdentity:
  enabled: false
  clientId: ""

keyVault:
  name: ""
  tenantId: ""

# internal-service-token is NEW: admin-backend now calls booking-service's
# internal admin API and sends this shared secret as the X-Internal-Token
# header (requireInternalToken on the receiving side) — same object, same
# value, read by all four services' SecretProviderClass.
secretProviderClass:
  enabled: false
  secretName: admin-backend-secrets
  objects:
    # Distinct from backend's/payment-service's own *-mongo-uri objects
    # post-split — this one points at the homeease_admin database
    # (admin-backend now owns only auditlogs).
    - keyVaultObject: admin-mongo-uri
      envKey: MONGO_URI
    - keyVaultObject: jwt-secret
      envKey: JWT_SECRET
    - keyVaultObject: internal-service-token
      envKey: INTERNAL_SERVICE_TOKEN

extraLabels: {}

# bookingClient.js / bookingServiceClient.js (admin-backend/services/
# bookingServiceClient.js) falls back to http://127.0.0.1:5000 — a
# local-dev-only default — when this isn't set. "backend" is the
# same-namespace Kubernetes Service short name for booking-service, so
# this value is correct in any namespace backend is also deployed into;
# not something that needs to vary per environment. This is new:
# admin-backend didn't call anything over HTTP before this split.
env:
  bookingServiceUrl: http://backend:5000
  azureStorageAccountName: ""

# Scraped by the platform Prometheus (needs the monitoring.coreos.com CRDs).
serviceMonitor:
  enabled: true
