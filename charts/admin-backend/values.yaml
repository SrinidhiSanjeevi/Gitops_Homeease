image:
  repository: homeease/admin-backend
  tag: placeholder
  pullPolicy: IfNotPresent

service:
  port: 5001
  targetPortName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

ingress:
  enabled: true
  host: admin.dev.example.com
  paths:
    - /api
    - /health
  tlsSecretName: admin-backend-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true

workloadIdentity:
  enabled: false
  clientId: ""

# AWS (EKS): IAM Roles for Service Accounts. The Azure equivalent is workloadIdentity above.
irsa:
  enabled: false
  roleArn: ""

keyVault:
  name: ""
  tenantId: ""

secretProviderClass:
  enabled: false
  # azure (Key Vault, default) or aws (Secrets Manager). For aws each object uses `awsSecret`
  # (the Secrets Manager name) instead of `keyVaultObject`, and `region` is required.
  provider: azure
  region: ""
  secretName: admin-backend-secrets
  objects:
    - keyVaultObject: admin-mongo-uri
      envKey: MONGO_URI
    - keyVaultObject: jwt-secret
      envKey: JWT_SECRET
    - keyVaultObject: internal-service-token
      envKey: INTERNAL_SERVICE_TOKEN

extraLabels: {}

env:
  # Free-form extra environment variables (name: value), e.g. TRUST_PROXY_HOPS.
  extra: {}
  bookingServiceUrl: http://backend:5000
  azureStorageAccountName: ""

serviceMonitor:
  enabled: true
