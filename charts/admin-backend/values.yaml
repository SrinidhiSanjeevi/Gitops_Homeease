# Cloud/environment-neutral defaults. Azure-dev-specific values live in
# values-azure-dev.yaml.

image:
  repository: homeease/admin-backend
  tag: placeholder
  pullPolicy: IfNotPresent

# No top-level `replicas` value on purpose — the HPA owns replica count.

service:
  port: 5001
  targetPortName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Explicit RollingUpdate default; some environments override to Recreate.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

ingress:
  enabled: true
  host: admin.dev.example.com
  # Only the API and health routes are public. /metrics (business counts,
  # revenue) stays cluster-internal — Prometheus scrapes it via the Service.
  paths:
    - /api
    - /health
  tlsSecretName: admin-backend-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true

# Shared Azure AD workload identity, same as backend; see charts/backend/values.yaml.
workloadIdentity:
  enabled: false
  clientId: ""

keyVault:
  name: ""
  tenantId: ""

# internal-service-token authenticates admin-backend's calls to booking-service's internal admin API.
secretProviderClass:
  enabled: false
  secretName: admin-backend-secrets
  objects:
    # Points at the homeease_admin database, distinct from other services' *-mongo-uri objects.
    - keyVaultObject: admin-mongo-uri
      envKey: MONGO_URI
    - keyVaultObject: jwt-secret
      envKey: JWT_SECRET
    - keyVaultObject: internal-service-token
      envKey: INTERNAL_SERVICE_TOKEN

extraLabels: {}

# "backend" is the same-namespace Service name for booking-service; correct in any namespace.
env:
  bookingServiceUrl: http://backend:5000
  azureStorageAccountName: ""

# Scraped by the platform Prometheus (needs the monitoring.coreos.com CRDs).
serviceMonitor:
  enabled: true
