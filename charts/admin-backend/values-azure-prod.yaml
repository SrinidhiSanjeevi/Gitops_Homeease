# Azure PROD overrides. STATUS: NOT DEPLOYED — REPLACE_ME values are filled in once the prod cluster exists.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/admin-backend
  tag: not-yet-promoted
ingress:
  host: REPLACE_ME_prod_admin_api_host
hpa:
  minReplicas: 2
workloadIdentity:
  enabled: true
  # terraform output workload_identity_app_client_id (id-homeease-app-prod)
  clientId: "REPLACE_ME_prod_app_client_id"
keyVault:
  name: kv-homeease-prod-hs01
  tenantId: "REPLACE_ME_tenant_id"
secretProviderClass:
  enabled: true
extraLabels:
  homeease.io/environment: prod
  homeease.io/cloud: azure
env:
  azureStorageAccountName: "REPLACE_ME_prod_storage_account"
