{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admin-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "admin-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Admin UI/API traffic, arrives via the ingress-nginx controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5001
    # Other HomeEase services in this same namespace calling admin-backend
    # server-to-server.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5001
    # Prometheus (kube-prometheus-stack, namespace "monitoring") scraping
    # /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5001
  # No egress block: egress stays unrestricted (admin-backend needs to
  # reach MongoDB and other internal services).
{{- end }}
