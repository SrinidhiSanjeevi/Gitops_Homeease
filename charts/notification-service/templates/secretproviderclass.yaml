{{- if .Values.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  # No app.kubernetes.io/name or part-of here — matching the same
  # convention every other service's SecretProviderClass uses in this
  # repo; only the environment/cloud extraLabels pair reaches it.
  {{- with .Values.extraLabels }}
  labels:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  provider: azure
  parameters:
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretProviderClass.objects }}
        - |
          objectName: {{ .keyVaultObject }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secretProviderClass.secretName }}
      type: Opaque
      data:
        {{- range .Values.secretProviderClass.objects }}
        - objectName: {{ .keyVaultObject }}
          key: {{ .envKey }}
        {{- end }}
{{- end }}
