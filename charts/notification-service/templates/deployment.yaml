apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  # No replicas field here on purpose — the HPA (templates/hpa.yaml) owns
  # spec.replicas.
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "notification-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notification-service.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: notification-service
      # REQUIRED CORRECTNESS SETTING — not configurable, not a values
      # toggle. Kubernetes auto-injects a NOTIFICATION_SERVICE_PORT env var
      # for every Service named "notification-service" in this namespace
      # (legacy Docker-links compatibility, format tcp://<clusterIP>:<port>)
      # — this collides with and silently overrides the app's OWN
      # NOTIFICATION_SERVICE_PORT read in server.js, so it tries to bind to
      # the literal string "tcp://10.20.x.x:80" instead of 5003 and
      # crash-loops on the startup probe. Disabling service-links avoids
      # the whole class of collision; nothing in this app relies on them.
      # (Same issue and same fix as payment-service — see that chart's
      # deployment.yaml.)
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "notification-service.selectorLabels" . | nindent 14 }}
      containers:
        - name: notification-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5003
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # BOOKING_SERVICE_URL: notification-service calls booking-service's
          # internal API for booking/user lookups instead of reading
          # Booking/User directly (see services/bookingServiceClient.js) —
          # same "bare ClusterIP short name" convention as backend's
          # PAYMENT_SERVICE_URL / payment-service's BOOKING_SERVICE_URL.
          env:
            - name: BOOKING_SERVICE_URL
              value: {{ .Values.env.bookingServiceUrl }}
          {{- if .Values.secretProviderClass.enabled }}
          # Populated by the Secrets Store CSI driver's secretObjects sync
          # (see templates/secretproviderclass.yaml) — the app reads
          # MONGO_URI / EMAIL_USER / EMAIL_PASS / EMAIL_FROM /
          # INTERNAL_SERVICE_TOKEN from process.env exactly as it already
          # does locally via .env.
          envFrom:
            - secretRef:
                name: {{ .Values.secretProviderClass.secretName }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secretProviderClass.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secretProviderClass.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: notification-service
        {{- end }}
