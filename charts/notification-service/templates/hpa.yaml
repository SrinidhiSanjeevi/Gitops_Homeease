# No CPU/memory-based scaling reasoning applies here the way it does for
# backend/admin-backend/frontend — sending emails is bursty and I/O-bound
# (SMTP round-trip), not CPU-bound, so a CPU target doesn't reflect actual
# notification load. Kept as a fixed floor/ceiling (1-2), same as
# payment-service, not a real autoscaling policy.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuTargetPercent }}
