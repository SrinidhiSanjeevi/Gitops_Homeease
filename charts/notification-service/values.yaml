image:
  repository: homeease/notification-service
  tag: placeholder
  pullPolicy: IfNotPresent

service:
  port: 5003
  targetPortName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hpa:
  minReplicas: 1
  maxReplicas: 2
  cpuTargetPercent: 70

pdb:
  maxUnavailable: 1

networkPolicy:
  enabled: true

env:
  # Free-form extra environment variables (name: value), e.g. TRUST_PROXY_HOPS.
  extra: {}
  bookingServiceUrl: http://backend:5000
  # Optional: comma-separated addresses that receive a copy (BCC) of every email, e.g. an admin/ops mailbox.
  notificationBcc: ""

workloadIdentity:
  enabled: false
  clientId: ""

# AWS (EKS): IAM Roles for Service Accounts. The Azure equivalent is workloadIdentity above.
irsa:
  enabled: false
  roleArn: ""

keyVault:
  name: ""
  tenantId: ""

secretProviderClass:
  enabled: false
  # azure (Key Vault, default) or aws (Secrets Manager). For aws each object uses `awsSecret`
  # (the Secrets Manager name) instead of `keyVaultObject`, and `region` is required.
  provider: azure
  region: ""
  secretName: notification-service-secrets
  objects:
    - keyVaultObject: notification-mongo-uri
      envKey: MONGO_URI
    - keyVaultObject: email-user
      envKey: EMAIL_USER
    - keyVaultObject: email-pass
      envKey: EMAIL_PASS
    - keyVaultObject: email-from
      envKey: EMAIL_FROM
    - keyVaultObject: internal-service-token
      envKey: INTERNAL_SERVICE_TOKEN

extraLabels: {}

serviceMonitor:
  enabled: true
