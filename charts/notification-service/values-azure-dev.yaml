# Azure DEV overrides for notification-service.
#
# Now a structural twin of charts/payment-service/values-azure-dev.yaml —
# id-homeease-notification-dev (workload identity + federated credential +
# Key Vault Secrets User role) exists in Infrastructure_Homeease terraform
# state, and notification-mongo-uri/email-user/email-pass/email-from/
# internal-service-token all exist in kv-homeease-dev-hs02 (see
# modules/keyvault/SECRETS.md).
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/notification-service
  tag: "80f42b2b4523"
workloadIdentity:
  enabled: true
  # terraform output workload_identity_notification_client_id
  clientId: "9f37b327-d33b-48e2-bd86-bf2848e7b671"
keyVault:
  name: kv-homeease-dev-hs02
  tenantId: "268c9f5b-bb6f-44e8-b872-ea399b1998c2"
secretProviderClass:
  enabled: true
extraLabels:
  homeease.io/environment: dev
  homeease.io/cloud: azure
# Free Trial subscription: hard 4-vCPU cap, so DEV is one 2-vCPU node.
# Only the CPU *request* is lowered so the whole stack schedules; limits
# come from values.yaml unchanged, so the pod can still burst. Same
# override every other service's dev file already applies.
resources:
  requests:
    cpu: 50m
# Same 4-vCPU cap above means there is no headroom for a RollingUpdate's
# surge pod (old + new pod at once) — the autoscaler can't add a node to
# cover it either (Azure subscription's regional core quota is maxed out).
# Recreate terminates the old pod before starting the new one: a few
# seconds of downtime per deploy on this single-replica dev environment,
# traded for rollouts that don't get stuck Pending indefinitely. Same
# override every other service's dev file already applies.
updateStrategy:
  type: Recreate
