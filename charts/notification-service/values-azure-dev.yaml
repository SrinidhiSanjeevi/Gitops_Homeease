# Azure DEV overrides for notification-service.
#
# STATUS: UNLIKE its three siblings (backend/admin-backend/payment-service),
# notification-service is a BRAND NEW deployable — it has no prior history
# in Infrastructure_Homeease terraform/azure/environments/dev at all. No
# Managed Identity/federated credential exists for it yet, no Key Vault
# access policy grants it read on any secret (incl. the new
# `notification-mongo-uri` and `internal-service-token` objects — see
# values.yaml), and no azure-pipelines.yml build has ever pushed a
# notification-service image to acrhomeeasedev01.azurecr.io. So even
# though this is nominally the "dev" values file, it is NOT deployable
# as-is — every REPLACE_ME below must be filled in from real Terraform/CI
# output first (the underscores are deliberate: invalid in
# hostnames/UUIDs/tags, so a premature sync fails loudly instead of
# half-working). Once that infra exists, this file becomes a direct
# structural twin of charts/payment-service/values-azure-dev.yaml.
image:
  repository: acrhomeeasedev01.azurecr.io/homeease/notification-service
  # No image has ever been built/pushed for this new service — filled in
  # by the first successful azure-pipelines.yml DEV build once one exists.
  tag: "REPLACE_ME_notification_dev_image_tag"
workloadIdentity:
  enabled: true
  # terraform output workload_identity_notification_client_id
  # (id-homeease-notification-dev) — NOT YET PROVISIONED. Infrastructure_
  # Homeease terraform needs a new azurerm_user_assigned_identity + Azure AD
  # federated credential (subject
  # system:serviceaccount:homeease-dev:notification-service) before this
  # can be filled in.
  clientId: "REPLACE_ME_notification_dev_client_id"
keyVault:
  # Same dev Key Vault the other 3 services already use — not new infra,
  # just needs the new objects (notification-mongo-uri, email-user,
  # email-pass, email-from, internal-service-token) granted to the new
  # identity above via an access policy/RBAC role assignment.
  name: kv-homeease-dev-hs02
  tenantId: "268c9f5b-bb6f-44e8-b872-ea399b1998c2"
secretProviderClass:
  enabled: true
extraLabels:
  homeease.io/environment: dev
  homeease.io/cloud: azure
# Free Trial subscription: hard 4-vCPU cap, so DEV is one 2-vCPU node.
# Only the CPU *request* is lowered so the whole stack schedules; limits
# come from values.yaml unchanged, so the pod can still burst. Same
# override every other service's dev file already applies.
resources:
  requests:
    cpu: 50m
